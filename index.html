<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мей Мей Merge</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;
       background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#222}
  h1{font-size:22px;margin:14px 0 4px}
  .hud{display:flex;gap:10px;margin:6px 0 10px}
  .box{background:#f0f0f4;border-radius:12px;padding:6px 14px;text-align:center;min-width:90px}
  .box b{display:block;font-size:20px}
  .box span{font-size:11px;color:#666;text-transform:uppercase}
  #board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,420px);
         background:#f6f6f9;padding:8px;border-radius:18px}
  .cell{aspect-ratio:1;border:2px solid transparent;border-radius:14px;background:#fff;padding:0;
        display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
        box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .cell canvas{width:92%;height:92%}
  .cell.sel{border-color:#ff3fa4;background:#fff0f8;transform:scale(1.04)}
  .cell.pop canvas{animation:pop .35s ease-out}
  .cell.new canvas{animation:appear .3s ease-out}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes appear{0%{transform:scale(0)}100%{transform:scale(1)}}
  .name{font-size:15px;margin:10px 0 2px;min-height:20px;font-weight:600}
  .hint{font-size:13px;color:#777;margin:0 12px 8px;text-align:center}
  .btns{display:flex;gap:10px;margin:6px 0}
  button.main{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;
              background:#222;color:#fff;cursor:pointer}
  button.alt{background:#ff3fa4}
  .evo{display:flex;gap:4px;margin:10px 0 20px;flex-wrap:wrap;justify-content:center;width:min(92vw,420px)}
  .evo canvas{width:11%;aspect-ratio:1;background:#f6f6f9;border-radius:8px;opacity:.35}
  .evo canvas.got{opacity:1}
  #over{position:fixed;inset:0;background:rgba(255,255,255,.92);display:none;
        flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  #over h2{margin:0;font-size:28px}
</style>
</head>
<body>
<h1>Мей Мей Merge 🐆</h1>
<div class="hud">
  <div class="box"><span>Очки</span><b id="score">0</b></div>
  <div class="box"><span>Рекорд</span><b id="best">0</b></div>
</div>
<div id="board"></div>
<div class="name" id="name"></div>
<p class="hint">Нажми на Мей Мей, потом на такого же — они сольются в нового!</p>
<div class="btns">
  <button class="main alt" id="add">+ Позвать Мей Мей</button>
  <button class="main" id="restart">Заново</button>
</div>
<div class="evo" id="evo"></div>

<div id="over">
  <h2>Поле заполнено 😿</h2>
  <div id="overScore"></div>
  <button class="main alt" id="again">Играть ещё</button>
</div>

<script>
// ------------------------------------------------------------------
// Свои картинки: положи PNG с прозрачным фоном в папку img/ с именами
// 1.png, 2.png, ... 8.png — игра сама их подхватит вместо рисунков.
// ------------------------------------------------------------------
const LEVELS = [
  {name:'Мей Мей',          fur:'#e8e8ec', shade:'#b5b5bf', spot:'#2a2a31'},
  {name:'Ледяной Мей',      fur:'#d4ecff', shade:'#9cc9ee', spot:'#2c4a78'},
  {name:'Зелёный пришелец', fur:'#5dff4a', shade:'#2fb82a', spot:'#0e5a12', antennae:true},
  {name:'Розовый Мей',      fur:'#ffd1e6', shade:'#f59bc4', spot:'#7a2a55'},
  {name:'Золотой Мей',      fur:'#ffe28a', shade:'#e0b030', spot:'#7a5200'},
  {name:'Король Мей',       fur:'#ffe28a', shade:'#e0b030', spot:'#7a5200', crown:true},
  {name:'Космо Мей',        fur:'#b79cff', shade:'#7a55e0', spot:'#1d1050', stars:true, glow:true},
  {name:'Легенда Мей',      fur:'#2a2a33', shade:'#000',    spot:'#ff3fa4', crown:true, stars:true, glow:true, eye:'#ff3fa4'}
];
const MAX = LEVELS.length;
const imgs = {};
LEVELS.forEach((_,i)=>{ const im=new Image(); im.onload=()=>{imgs[i+1]=im; render(); buildEvo();}; im.src='img/'+(i+1)+'.png'; });

function ell(x,cx,cy,rx,ry,fill,stroke){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  if(fill){x.fillStyle=fill;x.fill();} if(stroke){x.stroke();}}
function poly(x,pts,fill,stroke){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
  x.closePath(); if(fill){x.fillStyle=fill;x.fill();} if(stroke)x.stroke();}

function draw(c, lv){
  const s=c.width, x=c.getContext('2d'); x.clearRect(0,0,s,s);
  if(imgs[lv]){const im=imgs[lv], r=Math.min(s/im.width,s/im.height);
    x.drawImage(im,(s-im.width*r)/2,(s-im.height*r)/2,im.width*r,im.height*r); return;}
  const L=LEVELS[lv-1];
  x.save(); x.scale(s/100,s/100); x.lineWidth=1.6; x.strokeStyle=L.shade; x.lineJoin='round'; x.lineCap='round';
  if(L.glow){const g=x.createRadialGradient(50,50,8,50,50,52);
    g.addColorStop(0,'rgba(180,140,255,.55)'); g.addColorStop(1,'rgba(180,140,255,0)'); x.fillStyle=g; x.fillRect(0,0,100,100);}
  // тело
  x.fillStyle=L.fur; x.beginPath(); x.moveTo(20,100); x.quadraticCurveTo(18,62,32,56); x.lineTo(68,56);
  x.quadraticCurveTo(82,62,80,100); x.closePath(); x.fill(); x.stroke();
  // пятна на теле
  x.fillStyle=L.spot;
  [[28,70,5,2.4],[34,84,6,2.4],[72,68,5,2.4],[68,84,6,2.4],[26,92,5,2.2],[74,94,5,2.2]].forEach(p=>ell(x,p[0],p[1],p[2],p[3],L.spot));
  // уши
  poly(x,[[27,32],[29,8],[46,22]],L.fur,true); poly(x,[[73,32],[71,8],[54,22]],L.fur,true);
  poly(x,[[31,26],[32,15],[40,22]],L.shade); poly(x,[[69,26],[68,15],[60,22]],L.shade);
  // антенны пришельца
  if(L.antennae){x.strokeStyle='#2fb82a'; x.lineWidth=2.2;
    x.beginPath(); x.moveTo(42,18); x.quadraticCurveTo(34,8,38,0); x.stroke();
    x.beginPath(); x.moveTo(58,18); x.quadraticCurveTo(66,8,62,0); x.stroke();
    ell(x,38,1.5,2.4,2.4,'#5dff4a'); ell(x,62,1.5,2.4,2.4,'#5dff4a'); x.lineWidth=1.6; x.strokeStyle=L.shade;}
  // голова
  ell(x,50,38,25,22,L.fur,true);
  x.fillStyle=L.spot;
  [[42,20],[50,17],[58,20],[36,26],[64,26],[50,24]].forEach(p=>ell(x,p[0],p[1],2.4,1.2,L.spot));
  // мордочка
  ell(x,50,48,10,7,L.shade+'55');
  // глаза
  [40,60].forEach(cx=>{ ell(x,cx,38,7,7.5,'#0b0b0e');
    if(L.eye){x.strokeStyle=L.eye;x.lineWidth=1.4;ell(x,cx,38,6,6.5,null,true);x.strokeStyle=L.shade;x.lineWidth=1.6;}
    ell(x,cx-2,35.5,2.2,2.2,'#fff'); ell(x,cx+2,41,1,1,'#ffffffaa'); });
  // нос
  poly(x,[[46.5,46],[53.5,46],[50,50.5]],'#d98aa0');
  x.strokeStyle='#555'; x.lineWidth=.9;
  x.beginPath(); x.moveTo(50,50.5); x.lineTo(50,53); x.moveTo(50,53); x.quadraticCurveTo(47,56,44,54);
  x.moveTo(50,53); x.quadraticCurveTo(53,56,56,54); x.stroke();
  // усы
  x.strokeStyle=L.fur==='#2a2a33'?'#aaa':'#fff'; x.lineWidth=.8;
  [[-1,0],[-1,3],[1,0],[1,3]].forEach(([d,o])=>{x.beginPath();x.moveTo(50+d*8,50+o*.6);x.lineTo(50+d*22,49+o*2.2);x.stroke();});
  // лапка
  x.strokeStyle=L.shade; x.lineWidth=1.6;
  ell(x,50,84,14,15,L.fur,true);
  ell(x,50,88,7,6,L.spot);
  [[40,77],[50,74],[60,77]].forEach(p=>ell(x,p[0],p[1],3.2,4,L.spot));
  // корона
  if(L.crown){poly(x,[[34,16],[38,2],[44,11],[50,0],[56,11],[62,2],[66,16]],'#ffd23a',true);
    ell(x,50,6,1.8,1.8,'#ff3a5a'); ell(x,38,8,1.3,1.3,'#3aa0ff'); ell(x,62,8,1.3,1.3,'#3aa0ff');}
  // звёзды
  if(L.stars){x.fillStyle='#fff';[[10,20],[90,28],[12,60],[90,66],[84,8]].forEach(p=>{
    poly(x,[[p[0],p[1]-4],[p[0]+1.2,p[1]-1.2],[p[0]+4,p[1]],[p[0]+1.2,p[1]+1.2],[p[0],p[1]+4],[p[0]-1.2,p[1]+1.2],[p[0]-4,p[1]],[p[0]-1.2,p[1]-1.2]],'#fff');});}
  x.restore();
}

// ------------------------------ игра ------------------------------
let board, score, best=0, sel=null, over=false, maxLv=1, popIdx=-1, newIdx=-1;
try{best=+localStorage.getItem('meimei-best')||0;}catch(e){}
const $=id=>document.getElementById(id);
const boardEl=$('board');

function newGame(){
  board=Array(9).fill(0); score=0; sel=null; over=false; maxLv=1; popIdx=-1; newIdx=-1;
  $('over').style.display='none';
  spawn(); spawn(); spawn(); render(); buildEvo();
}
function spawn(){
  const e=[]; board.forEach((v,i)=>{if(!v)e.push(i);});
  if(!e.length) return false;
  newIdx=e[Math.random()*e.length|0]; board[newIdx]=1; return true;
}
function hasMoves(){
  for(let i=0;i<9;i++)for(let j=i+1;j<9;j++) if(board[i]&&board[i]===board[j]&&board[i]<MAX) return true;
  return false;
}
function checkOver(){
  if(board.every(v=>v) && !hasMoves()){
    over=true; $('overScore').textContent='Очки: '+score+'  •  Лучший Мей: '+LEVELS[maxLv-1].name;
    $('over').style.display='flex';
  }
}
function tap(i){
  if(over) return; popIdx=-1; newIdx=-1;
  if(!board[i]){ sel=null; }
  else if(sel===null){ sel=i; }
  else if(sel===i){ sel=null; }
  else if(board[sel]===board[i] && board[i]<MAX){
    board[i]++; board[sel]=0; popIdx=i; sel=null;
    score+=board[i]*10; if(board[i]>maxLv)maxLv=board[i];
    if(score>best){best=score; try{localStorage.setItem('meimei-best',best);}catch(e){}}
    spawn();
  } else { sel=i; }
  render(); buildEvo(); checkOver();
}
function render(){
  if(!board) return;
  boardEl.innerHTML='';
  board.forEach((v,i)=>{
    const b=document.createElement('button'); b.className='cell'+(sel===i?' sel':'')+(popIdx===i?' pop':'')+(newIdx===i?' new':'');
    if(v){const c=document.createElement('canvas'); c.width=c.height=200; draw(c,v); b.appendChild(c);}
    b.onclick=()=>tap(i); boardEl.appendChild(b);
  });
  $('score').textContent=score; $('best').textContent=best;
  $('name').textContent = sel!==null&&board[sel] ? LEVELS[board[sel]-1].name : '';
}
function buildEvo(){
  const e=$('evo'); e.innerHTML='';
  LEVELS.forEach((_,i)=>{const c=document.createElement('canvas'); c.width=c.height=80; draw(c,i+1);
    if(i+1<=maxLv)c.className='got'; e.appendChild(c);});
}
$('add').onclick=()=>{ if(over)return; popIdx=-1; if(spawn()){render();checkOver();} };
$('restart').onclick=newGame; $('again').onclick=newGame;
newGame();
</script>
</body>
</html>
