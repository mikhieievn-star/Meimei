<style>
  :root{--fg:#222;--sub:#777;--box:#f0f0f4;--panel:#f6f6f9}
  body.dark{--fg:#fff;--sub:#b8bce0;--box:rgba(255,255,255,.14);--panel:rgba(255,255,255,.1)}
  html,body,button{touch-action:manipulation}
  #board,#board *{touch-action:none}
  html{-webkit-text-size-adjust:100%}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html{min-height:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;background:#fff;color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .screen{display:flex;flex-direction:column;align-items:center;width:100%}
  h1{font-size:22px;margin:14px 0 4px}
  .hud{display:flex;gap:8px;margin:6px 0 6px}
  .box{background:var(--box);border-radius:12px;padding:6px 12px;text-align:center;min-width:80px}
  .box b{display:block;font-size:19px}
  .box span{font-size:10px;color:var(--sub);text-transform:uppercase}
  .box.coin b{color:#e0a000}
  .xptxt{font-size:12px;color:var(--sub);margin:2px 0}
  .bar{width:min(70vw,260px);height:9px;background:var(--box);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:#ff3fa4;width:0;transition:width .3s}
  #boostTag{font-size:12px;color:#e0a000;font-weight:700;min-height:16px;text-align:center}
  #board{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;width:min(92vw,420px);
         background:var(--panel);padding:8px;border-radius:18px}
  #board[style*="--n: 4"],#board[style*="--n:4"]{gap:6px}
  #board[style*="--n: 5"],#board[style*="--n:5"]{gap:4px}
  .cell{aspect-ratio:1;border:2px solid transparent;border-radius:14px;background:#fff;padding:0;
        display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
        box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .cell canvas{width:92%;height:92%}
  .gtop{display:flex;align-items:stretch;gap:8px;width:min(92vw,420px);margin-top:12px}
  .gstat{flex:1;background:var(--box);border-radius:14px;padding:6px 8px;text-align:center}
  .gstat b{display:block;font-size:19px}
  .gstat span{font-size:10px;color:var(--sub);text-transform:uppercase}
  .gstat.coin b{color:#e0a000}
  .icoBtn{border:0;border-radius:14px;width:48px;font-size:22px;background:var(--box);color:var(--fg);cursor:pointer;flex:none}
  .icoBtn.gold{background:#e0a000}
  .glv{width:min(92vw,420px);display:flex;flex-direction:column;align-items:center;margin:6px 0 0}
  .glv .bar{width:100%;margin:2px 0 4px}
  .gbar{display:flex;gap:10px;align-items:center;justify-content:center;width:min(92vw,420px);margin:8px 0 24px}
  .gbar .icoBtn{height:58px;width:58px}
  .gbar{gap:8px}
  #hammerBtn.on{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.3);animation:hpulse .8s infinite alternate}
  @keyframes hpulse{to{transform:scale(1.08)}}
  .gbar #add{flex:1;justify-content:center;padding:8px 16px;font-size:16px;border-radius:16px;height:58px}
  #board{box-shadow:0 4px 18px rgba(0,0,0,.08)}
  #tut{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:center;justify-content:center;padding:20px}
  #tut .card{background:#fff;color:#222;border-radius:22px;padding:22px 20px;max-width:360px;width:100%;text-align:center}
  #tut h2{margin:0 0 10px}
  #tut p{margin:8px 0;font-size:15px;text-align:left}
  #add{display:inline-flex;align-items:center;gap:6px;padding:6px 16px}
  #add canvas{width:40px;height:40px}
  #add .plus{font-size:26px;font-weight:800;line-height:1}
  #add small{font-size:11px;font-weight:700;opacity:.9}
  #inv .main{padding:8px 12px;font-size:15px}
  #board{touch-action:none;user-select:none;-webkit-user-select:none}
  .cell.tgt{border-color:#3fb950;background:#eaffef;transform:scale(1.06)}
  .cell.sel{border-color:#ff3fa4;background:#fff0f8;transform:scale(1.04)}
  .cell.pop canvas{animation:pop .35s ease-out}
  .cell.new canvas{animation:appear .3s ease-out}
  .float{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:800;font-size:16px;
         color:#d99200;pointer-events:none;animation:fl .9s ease-out forwards;text-shadow:0 1px 0 #fff;white-space:nowrap;z-index:3}
  .bp{position:absolute;left:50%;top:50%;font-size:18px;pointer-events:none;z-index:3;animation:burst .85s ease-out forwards}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
  @keyframes fl{to{transform:translate(-50%,-44px);opacity:0}}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes appear{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.12,.92)}60%{transform:translateY(0) scale(.92,1.1)}100%{transform:translateY(0) scale(1)}}
  .name{font-size:15px;margin:10px 0 2px;min-height:20px;font-weight:600}
  .hint{font-size:13px;color:var(--sub);margin:0 12px 8px;text-align:center}
  .btns{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap;justify-content:center}
  button.main{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;
              background:#222;color:#fff;cursor:pointer}
  body.dark button.main{background:rgba(255,255,255,.2)}
  button.alt,body.dark button.alt{background:#ff3fa4}
  button.gold,body.dark button.gold{background:#e0a000}
  button.purple,body.dark button.purple{background:#7a55e0}
  button:disabled{opacity:.4}
  .evo{display:flex;gap:3px;margin:10px 0 24px;flex-wrap:wrap;justify-content:center;width:min(92vw,420px)}
  .evo canvas{width:calc(100%/11 - 3px);aspect-ratio:1;background:#f6f6f9;border-radius:6px}
  .evo canvas.lock{filter:brightness(0);opacity:.15}

  #lobby{min-height:100vh;min-height:100dvh;justify-content:center;gap:8px;padding:16px 20px 28px}
  #lobby h1{font-size:30px;margin:0}
  #mascotWrap{position:relative;width:160px;height:160px;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
  #mascotWrap.hop{animation:hop .55s ease-out}
  #mascot{width:100%;height:100%}
  #lobby{gap:10px}
  .ptop{display:flex;align-items:center;gap:14px;width:min(92vw,420px);background:var(--panel);border-radius:20px;padding:10px 14px;cursor:pointer;box-sizing:border-box}
  #mascotWrap{flex:none;width:72px;height:72px;animation:none;border-radius:50%;background:#f0f0f4;overflow:hidden;box-sizing:border-box}
  .pinfo{flex:1;min-width:0;text-align:left}
  .pinfo .bar{width:100%;margin:4px 0 0}
  #mascotName{font-size:18px;font-weight:800;color:var(--fg)}
  #mascotTitle{font-size:12px;color:var(--sub)}
  #lobby .big.wide{width:min(92vw,420px)}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(92vw,420px)}
  .mgrid .big{width:100%;padding:14px 6px;font-size:15px}
  #lobby .iconrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,420px)}
  #lobby .iconrow .ib{width:auto}
  .cell.gold{background:linear-gradient(135deg,#fff3b0,#ffd23a)}
  .cell.gold::after{content:'✨×3';position:absolute;top:2px;right:4px;font-size:12px;font-weight:800;color:#8a5a00}
  .cell.ice canvas{opacity:.5;filter:saturate(.3)}
  .cell.ice{background:#dff3ff}
  .cell.ice::after{content:'❄️';position:absolute;top:2px;right:4px;font-size:18px}
  .big{width:min(80vw,300px);padding:14px;font-size:17px;border-radius:16px}
  .lstats{display:flex;gap:8px;margin-top:2px}
  .iconrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0}
  .ib{position:relative;width:54px;border:0;border-radius:14px;background:var(--box);color:var(--fg);padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .ib .em{font-size:24px;line-height:1}
  .ib small{font-size:10px;font-weight:600;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{display:none;position:absolute;top:-4px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;
       font-size:11px;font-style:normal;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
  .dot.on{display:block}

  #over{position:fixed;inset:0;background:rgba(255,255,255,.94);color:#222;display:none;z-index:30;
        flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  #over h2{margin:0;font-size:28px}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  #backdrop.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;background:#fff;color:#222;z-index:20;
        border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);
        transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;touch-action:pan-y}
  .sheet.open{transform:translateY(0)}
  .grab{width:42px;height:5px;border-radius:3px;background:#d8d8e0;margin:8px auto 0;flex:none}
  .sheet header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 12px;
        border-bottom:1px solid #eee;font-weight:700;font-size:17px;flex:none}
  .sheet header button{border:0;background:#f0f0f4;border-radius:10px;padding:8px 14px;font-size:15px;color:#222}
  .tabs{display:flex;gap:6px;padding:10px 14px 0;flex:none}
  .tab{flex:1;border:0;border-radius:10px;padding:9px 2px;background:#f0f0f4;font-weight:700;font-size:13px;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{background:#222;color:#fff}
  .note{font-size:12px;color:#888;padding:8px 16px 0;flex:none}
  .list{overflow-y:auto;padding:4px 14px 28px;overscroll-behavior:contain}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f4}
  .row canvas,.row .sw{width:54px;height:54px;background:#f6f6f9;border-radius:10px;flex:none;border:1px solid #e4e4ea}

    if(tr%5===0) return {k:'gift',v:Math.min(18,3+Math.floor(tr/5))};
    return {k:'coins',v:20+tr*8};
  }
  if(tr===25) return {k:'bg',v:11};

  return {k:'coins',v:50+tr*20};
}

function meow(lv, sad){
  if(muted||vol<=0) return;
  try{
    const V=VOICES.find(z=>z.id===voiceId)||VOICES[0]; const a=ac(), tm=a.currentTime, dur=((sad?0.9:0.42)+Math.random()*0.12)*V.d;
    const base=((sad?330:560)-Math.min(lv,40)*5+Math.random()*70)*V.p;
    const o=a.createOscillator(); o.type=V.w;
    o.frequency.setValueAtTime(base*0.8,tm);
    o.frequency.linearRampToValueAtTime(base*(sad?1.1:1.55),tm+dur*0.35);
    o.frequency.linearRampToValueAtTime(base*(sad?0.6:0.9),tm+dur);
    const vib=a.createOscillator(), vg=a.createGain(); vib.frequency.value=V.v; vg.gain.value=base*0.025;
    vib.connect(vg); vg.connect(o.frequency);
    const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=4.5;
    f.frequency.setValueAtTime(700*V.f,tm); f.frequency.linearRampToValueAtTime(1900*V.f,tm+dur*0.4); f.frequency.linearRampToValueAtTime(850*V.f,tm+dur);
    const g=a.createGain(); g.gain.setValueAtTime(0.0001,tm);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,0.55*vol),tm+0.07); g.gain.exponentialRampToValueAtTime(0.0001,tm+dur);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(tm); vib.start(tm); o.stop(tm+dur+0.05); vib.stop(tm+dur+0.05);
  }catch(e){}
}

const TR=()=>MUSIC[trackId]||MUSIC.calm;
const mf=m=>440*Math.pow(2,(m-69)/12);
let mTimer=null, mNext=0, mStep=0, mMaster=null, mDelay=null, mLp=null;
function musicStart(){
  if(!musicOn||mvol<=0||mTimer) return;
  try{
    const a=ac();
    mMaster=a.createGain(); mMaster.gain.value=0; mMaster.connect(a.destination);
    mLp=a.createBiquadFilter(); mLp.type='lowpass'; mLp.frequency.value=TR().lp; mLp.connect(mMaster);
    mDelay=a.createDelay(1.5); mDelay.delayTime.value=TR().dly;
    const fb=a.createGain(); fb.gain.value=0.38; mDelay.connect(fb); fb.connect(mDelay); mDelay.connect(mLp);
    mMaster.gain.setTargetAtTime(mvol*0.45,a.currentTime,0.8);
    mNext=a.currentTime+0.2; mStep=0;
    mTimer=setInterval(musicTick,600); musicTick();
  }catch(e){}
}
function musicTick(){
  try{ const a=ac(); while(mNext<a.currentTime+3){ const T=TR(); schedChord(a,mNext,T.chords[mStep%T.chords.length]); mNext+=T.len; mStep++; } }catch(e){}
}
function schedChord(a,t0,chord){
  const T=TR(), L=T.len, pg=T.pg;
  chord.forEach((m,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type=i===0?T.pad[0]:T.pad[1]; o.frequency.value=mf(m);
    o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime((i===0?0.16:0.07)*pg,t0+Math.min(1.8,L/3)); g.gain.linearRampToValueAtTime(0.0001,t0+L+0.4);
    o.connect(g); g.connect(mLp); const s2=a.createGain(); s2.gain.value=0.5; g.connect(s2); s2.connect(mDelay);
    o.start(t0); o.stop(t0+L+0.5);
  });
  const n=T.bells[0]+Math.floor(Math.random()*T.bells[1]);
  for(let k=0;k<n;k++){
    const tt=t0+0.5+k*(L-1)/n+Math.random()*0.3, m=T.pent[Math.floor(Math.random()*T.pent.length)];
    const o=a.createOscillator(), g=a.createGain(); o.type=T.bt; o.frequency.value=mf(m);
    g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(0.09,tt+0.03); g.gain.exponentialRampToValueAtTime(0.0001,tt+1.6);
    o.connect(g); g.connect(mLp); const s2=a.createGain(); s2.gain.value=0.7; g.connect(s2); s2.connect(mDelay);
    o.start(tt); o.stop(tt+1.7);
  }
}
function musicStop(){
  if(mTimer){ clearInterval(mTimer); mTimer=null; }
  if(mMaster){
    try{ const a=ac(); mMaster.gain.cancelScheduledValues(a.currentTime); mMaster.gain.setTargetAtTime(0,a.currentTime,0.15);
      const mm=mMaster; setTimeout(()=>{try{mm.disconnect();}catch(e){}},900); }catch(e){}
    mMaster=null;
  }
}

function ensureQuests(){
  const td=today(); if(quest.date===td && quest.list && quest.list.length && !quest.list.some(q=>q.t==='boost')) return;
  const r=seedRand(td+plv);
  const pick=['merge', r()<0.5?'earn':'play', 'combo', r()<0.5?'reach':'timed'];
  quest={date:td,list:pick.map(ty=>{
    if(ty==='merge') return {t:ty,need:40+plv*4,prog:0,done:false,rw:90+plv*8};
    if(ty==='earn')  return {t:ty,need:300+plv*100,prog:0,done:false,rw:120+plv*12};
    if(ty==='play')  return {t:ty,need:4,prog:0,done:false,rw:80+plv*6};
    if(ty==='boost') return {t:ty,need:3,prog:0,done:false,rw:100+plv*8};
    if(ty==='combo') return {t:ty,need:4+Math.min(6,Math.floor(plv/3)),prog:0,done:false,rw:130+plv*10};
    if(ty==='timed') return {t:ty,need:150+plv*25,prog:0,done:false,rw:150+plv*12};
    return {t:ty,need:Math.min(MAX,maxEver+2),prog:0,done:false,rw:160+maxEver*12};
  })}; save();
}
function qAdd(ty,n){ ensureQuests(); quest.list.forEach(q=>{ if(q.t===ty&&q.prog<q.need) q.prog=Math.min(q.need,q.prog+n); }); }
function qMax(ty,v){ ensureQuests(); quest.list.forEach(q=>{ if(q.t===ty&&v>q.prog) q.prog=Math.min(q.need,v); }); }
const achVal=k=>k==='merges'?stats.merges:k==='earned'?stats.earned:k==='level'?maxEver:k==='games'?stats.games:k==='bgs'?owned.length:Math.max(bpBest,bpTier());
function dailyInfo(){
  if(dailyLast===today()) return {claimed:true,day:dailyStreak};
  return {claimed:false,day:(dailyLast===yesterday()&&dailyStreak<7)?dailyStreak+1:1};
}
function dailyRew(day){
  const m=1+Math.floor(plv/5);
  if(day<7) return {k:'coins',v:[30,45,70,100,150,220][day-1]*m};
  return {k:'combo',coins:350*m,gift:8};
}
const dailyLabel=r=>r.k==='coins'?'🪙 '+fmt(r.v):'🪙 '+fmt(r.coins)+' + '+t('bp_gift',r.gift);

function badge(btn,n){ const d=btn.querySelector('.dot'); d.textContent=n; d.classList.toggle('on',n>0); }
function updateBadges(){
  ensureQuests();
  const b={};
  b.daily=dailyInfo().claimed?0:1;
  b.quests=quest.list.filter(q=>q.prog>=q.need&&!q.done).length;
  b.ach=ACH.filter((a,i)=>achVal(a.k)>=a.n&&achClaimed.indexOf(i)<0).length;
  b.coll=COLL.filter(c=>seen.length>=c.n&&collClaimed.indexOf(c.n)<0).length;
  b.wheel=wheelDate!==today()?1:0;
  b.chal=chalDone!==today()?1:0;
  checkEvent(); b.event=evtMs().filter((n,i)=>evtProg>=n&&evtClaimed.indexOf(i)<0).length;
  b.nursery=pets.filter(p=>p&&petAmount(p)>=10).length;
  document.querySelectorAll('.ib').forEach(btn=>badge(btn,b[btn.dataset.panel]||0));
}

function drawWheel(c){
  const x=c.getContext('2d'), s=c.width, r=s/2-4, a=Math.PI*2/WHEEL.length;
  x.clearRect(0,0,s,s);
  WHEEL.forEach((p,i)=>{
    x.beginPath(); x.moveTo(s/2,s/2); x.arc(s/2,s/2,r,-Math.PI/2+i*a-a/2,-Math.PI/2+i*a+a/2); x.closePath();
    x.fillStyle=p.c; x.fill(); x.strokeStyle='#fff'; x.lineWidth=3; x.stroke();
    x.save(); x.translate(s/2,s/2); x.rotate(i*a); x.fillStyle='#222'; x.font='bold '+(s/13)+'px system-ui,sans-serif';
    x.textAlign='center'; x.fillText(wheelLabel(p),0,-r*0.68); x.restore();
  });
  x.beginPath(); x.arc(s/2,s/2,s/16,0,Math.PI*2); x.fillStyle='#fff'; x.fill();
}

function claimDaily(){
  const info=dailyInfo(); if(info.claimed) return;
  const r=dailyRew(info.day);
  if(r.k==='coins') coins+=r.v; else { coins+=r.coins; gifts.push(r.gift); }

}
function claimQuest(i){
  const q=quest.list[i]; if(!q||q.done||q.prog<q.need) return;
  q.done=true; coins+=q.rw; addXp(20); save(); coinSound(); toast(t('bp_got','🪙 '+fmt(q.rw))); buildPanel(); updateLobby();
}
function claimAch(i){
  const a=ACH[i]; if(achClaimed.indexOf(i)>=0||achVal(a.k)<a.n) return;
  achClaimed.push(i); coins+=a.r; save(); coinSound(); toast(t('bp_got','🪙 '+fmt(a.r))); buildPanel(); updateLobby();
}
function claimColl(n){
  const c=COLL.find(z=>z.n===n); if(collClaimed.indexOf(n)>=0||seen.length<n) return;
  collClaimed.push(n); coins+=c.r; save(); coinSound(); toast(t('bp_got','🪙 '+fmt(c.r))); buildPanel(); updateLobby();
}
function spin(){
  if(spinning) return;
  const free=wheelDate!==today();
  if(!free && coins<WHEEL_COST){ toast(t('no_coins')); return; }
  if(free) wheelDate=today(); else coins-=WHEEL_COST;
  spinning=true; save();
  const tw=WHEEL.reduce((s,p)=>s+p.w,0); let r=Math.random()*tw, idx=0;
  for(;idx<WHEEL.length;idx++){ r-=WHEEL[idx].w; if(r<=0) break; } if(idx>=WHEEL.length) idx=WHEEL.length-1;
  const el=$('wheelCv'), base=Math.floor(wheelRot/360)*360;
  wheelRot=base+360*5+((360-idx*45)%360)+(Math.random()*20-10);
  el.style.transition='transform 3.2s cubic-bezier(.17,.67,.2,1)'; el.style.transform='rotate('+wheelRot+'deg)';
  const btn=document.querySelector('.spinbtn'); if(btn) btn.disabled=true;
  setTimeout(()=>{
    const p=WHEEL[idx]; let lab;
    if(p.k==='coins'){ coins+=p.v; lab='🪙 '+p.v; }
    else if(p.k==='xp'){ addXp(p.v); lab=t('w_xp',p.v); }
    else { const lv=2+Math.floor(Math.random()*Math.max(1,Math.min(MAX,maxEver)-1)); gifts.push(lv); lab=t('bp_gift',lv); }
    spinning=false; save(); coinSound(); meow(3); toast(t('w_prize',lab));
    if($('panel').classList.contains('open')&&panelType==='wheel') buildPanel(); updateLobby();
  },3300);
}

  $('game').style.display  = name==='game'  ? 'flex' : 'none';
  closeSheets(); $('over').style.display='none';

}

  if(b.length!==n){ const nb=Array(n).fill(0); let k=0; b.forEach(v=>{ if(v&&k<n) nb[k++]=v; }); b=nb; }
  board=b; score=g.score||0; maxLv=g.maxLv||1; stageLv=g.stageLv||1;
  golden=(g.golden>=0&&g.golden<n&&b[g.golden]>0)?g.golden:-1; frozen=(g.frozen>=0&&g.frozen<n&&b[g.frozen]>0)?g.frozen:-1;

  sel=null; over=false; combo=0; mode=null; magic=false; popIdx=-1; newIdx=-1; floatQ=null; hammerOn=false;
  $('over').style.display='none'; render(); updateTag(); updateAdd(); checkOver();
}

// ---- код сохранения ----
const SAVE_MAGIC='MEIMEI1:';
function makeCode(){ save(); const raw=localStorage.getItem('meimei-save5')||'{}'; return SAVE_MAGIC+btoa(unescape(encodeURIComponent(raw))); }
$('bkCopy').onclick=()=>{
  let code; try{ code=makeCode(); }catch(e){ toast(t('bk_bad')); return; }
  const fb=()=>{ try{ prompt(t('bk_manual'),code); }catch(e){} };
  try{ navigator.clipboard.writeText(code).then(()=>toast(t('bk_copied'),3200),fb); }catch(e){ fb(); }
};
$('bkPaste').onclick=()=>{
  let c; try{ c=prompt(t('bk_prompt'),''); }catch(e){ return; }
  if(!c) return; c=c.trim();
  try{
    if(c.indexOf(SAVE_MAGIC)!==0) throw 0;
    const raw=decodeURIComponent(escape(atob(c.slice(SAVE_MAGIC.length))));
    const d=JSON.parse(raw); if(!d||typeof d!=='object'||d.coins===undefined) throw 0;
    localStorage.setItem('meimei-save5',raw); toast(t('bk_ok')); setTimeout(()=>location.reload(),700);
  }catch(e){ toast(t('bk_bad')); }
};

const hx=document.createElement('label'); hx.setAttribute('aria-hidden','true');

function haptic(ms,n){ if(!vibe) return; n=n||1;
  try{ if(navigator.vibrate){ navigator.vibrate(n>1?[ms||10,40,ms||10]:(ms||10)); return; } }catch(e){}
  try{ hx.click(); if(n>1) setTimeout(()=>{ try{ hx.click(); }catch(e){} },70); }catch(e){} }
function tickSound(){
  if(muted||vol<=0) return;
  try{ const a=ac(), tm=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(560,tm); o.frequency.exponentialRampToValueAtTime(840,tm+0.05);
    g.gain.setValueAtTime(0.0001,tm); g.gain.exponentialRampToValueAtTime(Math.max(0.001,0.09*vol),tm+0.008); g.gain.exponentialRampToValueAtTime(0.0001,tm+0.09);
    o.connect(g); g.connect(a.destination); o.start(tm); o.stop(tm+0.1); }catch(e){}
}

(function(){ let lt=0;
  // второй быстрый тап: гасим зум и сами отправляем клик, чтобы быстрые нажатия не терялись
  document.addEventListener('touchend',e=>{
    const n=Date.now(), el=e.target;
    if(n-lt<400 && e.cancelable && !(el.closest&&el.closest('input,textarea,select'))){ e.preventDefault(); if(el.click) el.click(); }

  },{passive:false});

})();
