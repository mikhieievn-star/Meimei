<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мей Мей Merge</title>
<style>
  :root{--fg:#222;--sub:#777;--box:#f0f0f4;--panel:#f6f6f9}
  body.dark{--fg:#fff;--sub:#b8bce0;--box:rgba(255,255,255,.14);--panel:rgba(255,255,255,.1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;min-height:100vh;background:#fff;color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .screen{display:flex;flex-direction:column;align-items:center;width:100%}
  h1{font-size:22px;margin:14px 0 4px}
  .hud{display:flex;gap:8px;margin:6px 0 6px}
  .box{background:var(--box);border-radius:12px;padding:6px 12px;text-align:center;min-width:80px}
  .box b{display:block;font-size:19px}
  .box span{font-size:10px;color:var(--sub);text-transform:uppercase}
  .box.coin b{color:#e0a000}
  .xptxt{font-size:12px;color:var(--sub);margin:2px 0}
  .bar{width:min(70vw,260px);height:9px;background:var(--box);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:#ff3fa4;width:0;transition:width .3s}
  #boostTag{font-size:12px;color:#e0a000;font-weight:700;min-height:16px;text-align:center}
  #board{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;width:min(92vw,420px);
         background:var(--panel);padding:8px;border-radius:18px}
  #board[style*="--n: 4"],#board[style*="--n:4"]{gap:6px}
  #board[style*="--n: 5"],#board[style*="--n:5"]{gap:4px}
  .cell{aspect-ratio:1;border:2px solid transparent;border-radius:14px;background:#fff;padding:0;
        display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
        box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .cell canvas{width:92%;height:92%}
  .cell.sel{border-color:#ff3fa4;background:#fff0f8;transform:scale(1.04)}
  .cell.pop canvas{animation:pop .35s ease-out}
  .cell.new canvas{animation:appear .3s ease-out}
  .float{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:800;font-size:16px;
         color:#d99200;pointer-events:none;animation:fl .9s ease-out forwards;text-shadow:0 1px 0 #fff;white-space:nowrap;z-index:3}
  .bp{position:absolute;left:50%;top:50%;font-size:18px;pointer-events:none;z-index:3;animation:burst .85s ease-out forwards}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
  @keyframes fl{to{transform:translate(-50%,-44px);opacity:0}}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes appear{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.12,.92)}60%{transform:translateY(0) scale(.92,1.1)}100%{transform:translateY(0) scale(1)}}
  .name{font-size:15px;margin:10px 0 2px;min-height:20px;font-weight:600}
  .hint{font-size:13px;color:var(--sub);margin:0 12px 8px;text-align:center}
  .btns{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap;justify-content:center}
  button.main{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;
              background:#222;color:#fff;cursor:pointer}
  body.dark button.main{background:rgba(255,255,255,.2)}
  button.alt,body.dark button.alt{background:#ff3fa4}
  button.gold,body.dark button.gold{background:#e0a000}
  button.purple,body.dark button.purple{background:#7a55e0}
  button:disabled{opacity:.4}
  .evo{display:flex;gap:3px;margin:10px 0 24px;flex-wrap:wrap;justify-content:center;width:min(92vw,420px)}
  .evo canvas{width:calc(100%/11 - 3px);aspect-ratio:1;background:#f6f6f9;border-radius:6px}
  .evo canvas.lock{filter:brightness(0);opacity:.15}

  #lobby{min-height:100vh;justify-content:center;gap:8px;padding:16px 20px 28px}
  #lobby h1{font-size:30px;margin:0}
  #mascotWrap{position:relative;width:160px;height:160px;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
  #mascotWrap.hop{animation:hop .55s ease-out}
  #mascot{width:100%;height:100%}
  .big{width:min(80vw,300px);padding:14px;font-size:17px;border-radius:16px}
  .lstats{display:flex;gap:8px;margin-top:2px}
  .iconrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
  .ib{position:relative;width:62px;border:0;border-radius:14px;background:var(--box);color:var(--fg);padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .ib .em{font-size:24px;line-height:1}
  .ib small{font-size:10px;font-weight:600;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{display:none;position:absolute;top:-4px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;
       font-size:11px;font-style:normal;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
  .dot.on{display:block}

  #over{position:fixed;inset:0;background:rgba(255,255,255,.94);color:#222;display:none;z-index:30;
        flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  #over h2{margin:0;font-size:28px}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  #backdrop.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;background:#fff;color:#222;z-index:20;
        border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);
        transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;touch-action:pan-y}
  .sheet.open{transform:translateY(0)}
  .grab{width:42px;height:5px;border-radius:3px;background:#d8d8e0;margin:8px auto 0;flex:none}
  .sheet header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 12px;
        border-bottom:1px solid #eee;font-weight:700;font-size:17px;flex:none}
  .sheet header button{border:0;background:#f0f0f4;border-radius:10px;padding:8px 14px;font-size:15px;color:#222}
  .tabs{display:flex;gap:6px;padding:10px 14px 0;flex:none}
  .tab{flex:1;border:0;border-radius:10px;padding:9px 2px;background:#f0f0f4;font-weight:700;font-size:13px;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{background:#222;color:#fff}
  .note{font-size:12px;color:#888;padding:8px 16px 0;flex:none}
  .list{overflow-y:auto;padding:4px 14px 28px;overscroll-behavior:contain}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f4}
  .row canvas,.row .sw{width:54px;height:54px;background:#f6f6f9;border-radius:10px;flex:none;border:1px solid #e4e4ea}
  .row .sw.em{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .row canvas.lock{filter:brightness(0);opacity:.2}
  .row .info{flex:1;min-width:0}
  .row .info b{display:block;font-size:14px}
  .row .info small{color:#888;font-size:12px}
  .row.hl{background:#fff8e0}
  .row button{border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;
              background:#e0a000;color:#fff;white-space:nowrap}
  .row button.eq{background:#ff3fa4}
  .row button.ok{background:#e6f6e6;color:#3a8a3a}
  .row button:disabled{background:#ddd;color:#888}
  .row button.ok:disabled{background:#e6f6e6;color:#3a8a3a}
  .set{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #f0f0f4;font-size:16px;gap:10px}
  .set button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#222;color:#fff;font-size:14px}
  .set button.red{background:#e5484d}
  .set input[type=range]{width:46%}
  .langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .langs button{background:#f0f0f4;color:#222;padding:8px 10px}
  .langs button.on{background:#ff3fa4;color:#fff}
  #setBody{overflow-y:auto;padding-bottom:20px;overscroll-behavior:contain}

  .pbox{padding:10px 16px 4px;flex:none}
  .pbar{height:12px;background:#f0f0f4;border-radius:7px;overflow:hidden;margin:6px 0}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#7a55e0,#ff3fa4);width:0}
  .prow{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f4}
  .prow .tn{font-weight:800;color:#7a55e0;text-align:center}
  .prow.cur{background:#f7f2ff}
  .prow button{border:0;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;background:#f0f0f4;color:#888}
  .prow button.cl{background:#e0a000;color:#fff}
  .prow button.cl.g{background:#7a55e0}
  .prow button.dn{background:#e6f6e6;color:#3a8a3a}
  .phead{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;padding:4px 0;font-size:11px;font-weight:800;color:#888;text-align:center;text-transform:uppercase}

  .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0}
  .cc{background:#f6f6f9;border-radius:10px;text-align:center;font-size:11px;color:#888;padding:4px;cursor:pointer}
  .cc canvas{width:100%;aspect-ratio:1;display:block}
  .cc.lock canvas{filter:brightness(0);opacity:.2}
  .wheelwrap{position:relative;width:min(72vw,280px);margin:14px auto 8px}
  .wheelwrap canvas{width:100%;display:block;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;color:#e5484d;z-index:2;line-height:1}
  .spinbtn{display:block;margin:10px auto 4px;border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:#ff3fa4;color:#fff}
  .spinbtn:disabled{opacity:.5}
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);background:#222;color:#fff;
         padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;transition:transform .25s;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ============ ЛОББИ ============ -->
<div id="lobby" class="screen">
  <h1>Мей Мей Merge</h1>
  <div id="mascotWrap"><canvas id="mascot" width="320" height="320"></canvas></div>
  <div class="xptxt" id="mascotName"></div>
  <div class="xptxt xpl"></div>
  <div class="bar"><i class="xpfill"></i></div>
  <div class="lstats">
    <div class="box coin"><span data-i="coins"></span><b id="lCoins">0</b></div>
    <div class="box"><span data-i="best"></span><b id="lBest">0</b></div>
  </div>
  <div class="iconrow">
    <button class="ib" data-panel="daily"><span class="em">🎁</span><small data-i="daily"></small><i class="dot"></i></button>
    <button class="ib" data-panel="quests"><span class="em">📋</span><small data-i="quests"></small><i class="dot"></i></button>
    <button class="ib" data-panel="ach"><span class="em">🏆</span><small data-i="ach"></small><i class="dot"></i></button>
    <button class="ib" data-panel="coll"><span class="em">📖</span><small data-i="coll"></small><i class="dot"></i></button>
    <button class="ib" data-panel="wheel"><span class="em">🎡</span><small data-i="wheel"></small><i class="dot"></i></button>
  </div>
  <button class="main alt big" id="play" data-i="play"></button>
  <button class="main purple big" id="lPass"></button>
  <button class="main gold big" id="lShop" data-i="shop"></button>
  <button class="main big" id="lSet" data-i="settings"></button>
</div>

<!-- ============ ИГРА ============ -->
<div id="game" class="screen" style="display:none">
  <h1>Мей Мей Merge 🐆</h1>
  <div class="hud">
    <div class="box coin"><span data-i="coins"></span><b id="coins">0</b></div>
    <div class="box"><span data-i="score"></span><b id="score">0</b></div>
    <div class="box"><span data-i="best"></span><b id="best">0</b></div>
  </div>
  <div class="xptxt xpl"></div>
  <div class="bar"><i class="xpfill"></i></div>
  <div id="boostTag"></div>
  <div id="board"></div>
  <div class="name" id="name"></div>
  <p class="hint" id="hint" data-i="hint"></p>
  <div class="btns">
    <button class="main alt" id="add"></button>
    <button class="main gold" id="shopBtn" data-i="shop"></button>
    <button class="main purple" id="passBtn" data-i="pass"></button>
    <button class="main" id="restart" data-i="restart"></button>
    <button class="main" id="menu" data-i="menu"></button>
    <button class="main" id="snd">🔊</button>
    <button class="main" id="mus">🎵</button>
  </div>
  <div class="evo" id="evo"></div>
</div>

<div id="backdrop"></div>

<!-- ============ МАГАЗИН ============ -->
<div id="shop" class="sheet">
  <header><span><span data-i="shop"></span> · 🪙 <span id="shopCoins">0</span></span><button class="closeBtn" data-i="close"></button></header>
  <div class="tabs"><button class="tab" id="tabMei" data-i="tab_mei"></button><button class="tab" id="tabBoost" data-i="tab_boost"></button><button class="tab" id="tabField" data-i="tab_field"></button><button class="tab" id="tabBg" data-i="tab_bg"></button></div>
  <div class="note" id="shopNote"></div>
  <div class="list" id="shopList"></div>
</div>

<!-- ============ БАТЛ ПАСС ============ -->
<div id="pass" class="sheet">
  <header><span data-i="bp_t"></span><button class="closeBtn" data-i="close"></button></header>
  <div class="pbox">
    <div style="display:flex;justify-content:space-between;font-weight:700"><span id="pTier"></span><span id="pPts"></span></div>
    <div class="pbar"><i id="pFill"></i></div>
    <div class="xptxt" id="pNext"></div>
    <button class="main purple" id="pBuy" style="width:100%;margin-top:6px"></button>
  </div>
  <div class="note" data-i="bp_note"></div>
  <div class="list">
    <div class="phead"><span>#</span><span data-i="bp_free"></span><span data-i="bp_gold"></span></div>
    <div id="pList"></div>
  </div>
</div>

<!-- ============ ПАНЕЛЬ (бонус, задания, достижения, коллекция, колесо) ============ -->
<div id="panel" class="sheet">
  <header><span id="panelTitle"></span><button class="closeBtn" data-i="close"></button></header>
  <div class="note" id="panelNote"></div>
  <div class="list" id="panelList"></div>
</div>

<!-- ============ НАСТРОЙКИ ============ -->
<div id="settings" class="sheet">
  <header><span data-i="set_t"></span><button class="closeBtn" data-i="close"></button></header>
  <div id="setBody">
    <div class="set"><span data-i="set_lang"></span>
      <div class="langs"><button data-lang="uk">🇺🇦 UA</button><button data-lang="en">🇬🇧 EN</button><button data-lang="ru">🇷🇺 RU</button></div></div>
    <div class="set"><span data-i="set_music"></span><button id="setMus"></button></div>
    <div class="set"><span data-i="set_mvol"></span><input type="range" id="setMVol" min="0" max="100"></div>
    <div class="set"><span data-i="set_sound"></span><button id="setSnd"></button></div>
    <div class="set"><span data-i="set_vol"></span><input type="range" id="setVol" min="0" max="100"></div>
    <div class="set"><span data-i="set_vibe"></span><button id="setVibe"></button></div>
    <div class="set"><span data-i="set_hints"></span><button id="setHints"></button></div>
    <div class="set"><span data-i="set_reset"></span><button class="red" id="setReset" data-i="reset_btn"></button></div>
    <div class="note" data-i="reset_note"></div>
  </div>
</div>

<div id="toast"></div>
<div id="over">
  <h2 data-i="over_t"></h2>
  <div id="overScore"></div>
  <button class="main alt" id="again" data-i="again"></button>
  <button class="main" id="toLobby" data-i="to_lobby" style="background:#222"></button>
</div>

let AC;
function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function meow(lv, sad){
  if(muted||vol<=0) return;
  try{
    const a=ac(), tm=a.currentTime, dur=(sad?0.9:0.42)+Math.random()*0.12;
    const base=(sad?330:560)-Math.min(lv,40)*5+Math.random()*70;
    const o=a.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(base*0.8,tm);
    o.frequency.linearRampToValueAtTime(base*(sad?1.1:1.55),tm+dur*0.35);
    o.frequency.linearRampToValueAtTime(base*(sad?0.6:0.9),tm+dur);
    const vib=a.createOscillator(), vg=a.createGain(); vib.frequency.value=22; vg.gain.value=base*0.025;
    vib.connect(vg); vg.connect(o.frequency);
    const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=4.5;
    f.frequency.setValueAtTime(700,tm); f.frequency.linearRampToValueAtTime(1900,tm+dur*0.4); f.frequency.linearRampToValueAtTime(850,tm+dur);
    const g=a.createGain(); g.gain.setValueAtTime(0.0001,tm);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,0.55*vol),tm+0.07); g.gain.exponentialRampToValueAtTime(0.0001,tm+dur);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(tm); vib.start(tm); o.stop(tm+dur+0.05); vib.stop(tm+dur+0.05);
  }catch(e){}
}
function coinSound(){
  if(muted||vol<=0) return;

    [880,1320].forEach((fr,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=fr;
      g.gain.setValueAtTime(0.0001,tm+i*0.08); g.gain.exponentialRampToValueAtTime(Math.max(0.001,0.15*vol),tm+i*0.08+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,tm+i*0.08+0.12); o.connect(g); g.connect(a.destination);

  }catch(e){}
}

const CHORDS=[[48,55,59,64],[45,52,57,60],[41,48,52,57],[43,50,55,59]];
const PENT=[72,74,76,79,81,84,67,69];
const mf=m=>440*Math.pow(2,(m-69)/12);
let mTimer=null, mNext=0, mStep=0, mMaster=null, mDelay=null, mLp=null;
function musicStart(){
  if(!musicOn||mvol<=0||mTimer) return;
  try{
    const a=ac();
    mMaster=a.createGain(); mMaster.gain.value=0; mMaster.connect(a.destination);
    mLp=a.createBiquadFilter(); mLp.type='lowpass'; mLp.frequency.value=1400; mLp.connect(mMaster);
    mDelay=a.createDelay(1.5); mDelay.delayTime.value=0.52;
    const fb=a.createGain(); fb.gain.value=0.38; mDelay.connect(fb); fb.connect(mDelay); mDelay.connect(mLp);
    mMaster.gain.setTargetAtTime(mvol*0.45,a.currentTime,0.8);
    mNext=a.currentTime+0.2; mStep=0;
    mTimer=setInterval(musicTick,600); musicTick();
  }catch(e){}
}
function musicTick(){
  try{ const a=ac(); while(mNext<a.currentTime+3){ schedChord(a,mNext,CHORDS[mStep%4]); mNext+=6; mStep++; } }catch(e){}
}
function schedChord(a,t0,chord){
  chord.forEach((m,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type=i===0?'sine':'triangle'; o.frequency.value=mf(m);
    o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(i===0?0.16:0.07,t0+1.8); g.gain.linearRampToValueAtTime(0.0001,t0+6.4);
    o.connect(g); g.connect(mLp); const s=a.createGain(); s.gain.value=0.5; g.connect(s); s.connect(mDelay);
    o.start(t0); o.stop(t0+6.5);
  });
  const n=3+Math.floor(Math.random()*3);
  for(let k=0;k<n;k++){
    const tt=t0+0.8+k*1.1+Math.random()*0.4, m=PENT[Math.floor(Math.random()*PENT.length)];
    const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=mf(m);
    g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(0.09,tt+0.03); g.gain.exponentialRampToValueAtTime(0.0001,tt+1.6);
    o.connect(g); g.connect(mLp); const s=a.createGain(); s.gain.value=0.7; g.connect(s); s.connect(mDelay);
    o.start(tt); o.stop(tt+1.7);
  }
}
function musicStop(){
  if(mTimer){ clearInterval(mTimer); mTimer=null; }
  if(mMaster){
    try{ const a=ac(); mMaster.gain.cancelScheduledValues(a.currentTime); mMaster.gain.setTargetAtTime(0,a.currentTime,0.15);
      const mm=mMaster; setTimeout(()=>{try{mm.disconnect();}catch(e){}},900); }catch(e){}
    mMaster=null;
  }
}
function musicVol(){ if(mMaster){ try{ mMaster.gain.setTargetAtTime(mvol*0.45,ac().currentTime,0.1); }catch(e){} } }

function ensureQuests(){
  const td=today(); if(quest.date===td && quest.list && quest.list.length) return;
  const r=seedRand(td+plv);
  const pick=['merge', r()<0.5?'earn':'play', r()<0.5?'boost':'reach'];
  quest={date:td,list:pick.map(ty=>{
    if(ty==='merge') return {t:ty,need:12+plv,prog:0,done:false,rw:40+plv*5};
    if(ty==='earn')  return {t:ty,need:120+plv*40,prog:0,done:false,rw:60+plv*8};
    if(ty==='play')  return {t:ty,need:2,prog:0,done:false,rw:30+plv*3};
    if(ty==='boost') return {t:ty,need:1,prog:0,done:false,rw:50+plv*4};
    return {t:ty,need:Math.min(MAX,maxEver+1),prog:0,done:false,rw:100+maxEver*10};
  })}; save();
}
function qAdd(ty,n){ ensureQuests(); quest.list.forEach(q=>{ if(q.t===ty&&q.prog<q.need) q.prog=Math.min(q.need,q.prog+n); }); }
function qMax(ty,v){ ensureQuests(); quest.list.forEach(q=>{ if(q.t===ty&&v>q.prog) q.prog=Math.min(q.need,v); }); }
const achVal=k=>k==='merges'?stats.merges:k==='earned'?stats.earned:k==='level'?maxEver:k==='games'?stats.games:k==='bgs'?owned.length:bpTier();
function dailyInfo(){
  if(dailyLast===today()) return {claimed:true,day:dailyStreak};
  return {claimed:false,day:(dailyLast===yesterday()&&dailyStreak<7)?dailyStreak+1:1};
}
function dailyRew(day){
  const m=1+Math.floor(plv/5);
  if(day<7) return {k:'coins',v:[50,80,120,180,260,400][day-1]*m};
  return {k:'combo',coins:600*m,gift:8};
}
const dailyLabel=r=>r.k==='coins'?'🪙 '+fmt(r.v):'🪙 '+fmt(r.coins)+' + '+t('bp_gift',r.gift);

function badge(btn,n){ const d=btn.querySelector('.dot'); d.textContent=n; d.classList.toggle('on',n>0); }
function updateBadges(){

// ------------------------------ игра ------------------------------
let board, score=0, sel=null, over=false, maxLv=1, popIdx=-1, newIdx=-1, floatQ=null, cur='lobby', mode=null, magic=false;
const boardEl=$('board');
const N=()=>size*size;
const spawnLvl=()=>Math.min(8,1+Math.floor(maxEver/6));
function applySize(){ boardEl.style.setProperty('--n',size); }
function emptyCells(){ const e=[]; board.forEach((v,i)=>{if(!v)e.push(i);}); return e; }
function place(level){ const e=emptyCells(); if(!e.length) return false; newIdx=e[Math.random()*e.length|0]; board[newIdx]=level; return true; }
function updateAdd(){ $('add').textContent=t('add',spawnLvl()); }
function updateTag(){
  const p=[]; if(boost>0)p.push(t('x2_tag',boost)); if(magic)p.push(t('tag_magic')); if(mode==='hammer')p.push(t('tag_hammer'));
  $('boostTag').textContent=p.join('   ');
}
function setSize(n){
  if(n===size) return true;
  if(cur==='game' && board && n<size){ toast(t('fld_shrink_game')); return false; }
  if(cur==='game' && board){
    const nb=Array(n*n).fill(0);
    for(let r=0;r<size;r++)for(let c=0;c<size;c++) nb[r*n+c]=board[r*size+c];
    board=nb; sel=null;
  }
  size=n; save(); applySize(); if(cur==='game'&&board){ render(); } return true;
}

function newGame(){
  applySize();
  board=Array(N()).fill(0); score=0; sel=null; over=false; maxLv=1; popIdx=-1; newIdx=-1; floatQ=null; mode=null; magic=false;
  $('over').style.display='none';
  const g=gifts.slice(); gifts=[];
  g.forEach(l=>{ if(place(l)){ if(l>maxLv)maxLv=l; } else gifts.push(l); });
  const need=Math.max(0,3-board.filter(v=>v).length); for(let i=0;i<need;i++) place(spawnLvl());
  stats.games++; qAdd('play',1); save();
  render(); buildEvo(); updateTag(); updateAdd();
}
function hasMoves(){
  const n=N();
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++) if(board[i]&&board[i]===board[j]&&board[i]<MAX) return true;
  return false;
}
function checkOver(){
  if(board.every(v=>v) && !hasMoves() && !magic){
    over=true; meow(1,true);
    $('overScore').textContent=t('over_s',score,nm(maxLv));
    $('over').style.display='flex';
  }
}
function tap(i){
  if(over) return; popIdx=-1; newIdx=-1; floatQ=null;
  if(mode==='hammer'){
    if(board[i]){ board[i]=0; mode=null; sel=null; save(); updateTag(); render(); }
    return;
  }
  if(!board[i]){ sel=null; }
  else if(sel===null){ sel=i; }
  else if(sel===i){ sel=null; }
  else {
    const a=board[sel], b=board[i];
    const same=a===b&&b<MAX, magicOk=magic&&a!==b&&Math.max(a,b)<MAX;
    if(same||magicOk){
      const sb=spawnLvl(), nl=Math.max(a,b)+1; if(magicOk) magic=false;
      board[i]=nl; board[sel]=0; popIdx=i; sel=null;
      let gain=reward(nl), dbl=false; if(boost>0){ gain*=2; boost--; dbl=true; }
      coins+=gain; score+=nl*10; stats.merges++; stats.earned+=gain;
      if(nl>maxLv)maxLv=nl; if(nl>maxEver)maxEver=nl; if(score>best)best=score;
      qAdd('merge',1); qAdd('earn',gain); qMax('reach',nl);
      floatQ=[i,'+'+fmt(gain)+' 🪙'+(dbl?' ×2':''),nl];
      meow(nl); buzz(); place(spawnLvl()); addXp(nl*2); addBp(nl); save(); updateTag(); updateAdd();
      if(spawnLvl()>sb) setTimeout(()=>toast(t('spawn_up')),1100);
    } else { sel=i; }
  }
  render(); buildEvo(); checkOver();
  if($('shop').classList.contains('open')) buildShop();
  if($('pass').classList.contains('open')) buildPass();
  if($('panel').classList.contains('open')) buildPanel();
}
function render(){
  if(!board) return;
  boardEl.innerHTML='';
  board.forEach((v,i)=>{
    const b=document.createElement('button'); b.className='cell'+(sel===i?' sel':'')+(popIdx===i?' pop':'')+(newIdx===i?' new':'');
    if(v){const c=document.createElement('canvas'); c.width=c.height=200; draw(c,v); b.appendChild(c);}
    b.onclick=()=>tap(i); boardEl.appendChild(b);
  });
  if(floatQ){const el=boardEl.children[floatQ[0]];
    if(el){const sp=document.createElement('span'); sp.className='float'; sp.textContent=floatQ[1]; el.appendChild(sp);
      burst(el, floatQ[2]>=10?['❤️','✨','💖']:['🪙','✨','⭐'], 9);}
    floatQ=null;}
  $('score').textContent=fmt(score); $('best').textContent=fmt(best); $('coins').textContent=fmt(coins);
  $('name').textContent = sel!==null&&board[sel] ? nm(board[sel])+' ('+t('lvl_n',board[sel])+')' : '';
  updateXpUI();
}
function buildEvo(){
  const e=$('evo'); e.innerHTML='';
  LEVELS.forEach((_,i)=>{const c=document.createElement('canvas'); c.width=c.height=64; draw(c,i+1);
    if(i+1>maxEver)c.className='lock'; e.appendChild(c);});
}

let shopTab='bg';
const BOOSTS=[{id:'sweep',price:40,e:'🧹'},{id:'up',price:60,e:'⬆️'},{id:'x2',price:90,e:'✨'},{id:'hammer',price:30,e:'🔨'},
  {id:'magic',price:70,e:'🪄'},{id:'shuffle',price:25,e:'🔀'},{id:'box',price:80,e:'🎁'}];
function mkRow(left,title,small,btn){

function mkBtn(text,cls,fn,disabled){ const b=document.createElement('button'); b.textContent=text; if(cls)b.className=cls; if(fn)b.onclick=fn; b.disabled=!!disabled; return b; }
function emSw(txt){ const s=document.createElement('div'); s.className='sw em'; s.textContent=txt; return s; }

function openShop(){
  shopTab = cur==='game' ? 'mei' : 'bg';
  $('tabMei').style.display = cur==='game' ? '' : 'none';
  $('tabBoost').style.display = cur==='game' ? '' : 'none';

}
function buildShop(){
  $('shopCoins').textContent=fmt(coins);
  ['Mei','Boost','Field','Bg'].forEach(n=>{ $('tab'+n).className='tab'+(shopTab===n.toLowerCase()?' on':''); });
  $('tabMei').className='tab'+(shopTab==='mei'?' on':'');
  const list=$('shopList'); list.innerHTML='';
  if(shopTab==='mei'){
    $('shopNote').textContent=t('note_mei');
    for(let k=2;k<=MAX;k++){

      list.appendChild(mkRow(c,open?nm(k):'???',open?t('lvl_n',k)+' · '+t('merge_plus',fmt(reward(k))):t('opens',k-2),
        mkBtn(open?('🪙 '+fmt(p)):'🔒','',()=>buy(k),!open||coins<p||over)));
    }
  } else if(shopTab==='bg'){
    $('shopNote').textContent=t('note_bg');
    BGS.forEach(bg=>{
      const has=owned.indexOf(bg.id)>=0, locked=!bg.pass && plv<bg.need;
      const sw=document.createElement('div'); sw.className='sw'; sw.style.background=bg.css; sw.style.backgroundSize='cover';
      let btn;
      if(bgId===bg.id) btn=mkBtn(t('selected'),'eq',null,true);
      else if(has) btn=mkBtn(t('choose'),'eq',()=>equipBg(bg.id));
      else if(bg.pass) btn=mkBtn('🎟','',null,true);
      else if(locked) btn=mkBtn(t('lock_lvl',bg.need),'',null,true);
      else btn=mkBtn('🪙 '+fmt(bg.price),'',()=>buyBg(bg.id),coins<bg.price);
      list.appendChild(mkRow(sw,bgName(bg),has?t('bought'):bg.pass?t('pass_only'):locked?t('need_pl',bg.need):t('price_n',fmt(bg.price)),btn));
    });
  } else if(shopTab==='field'){
    $('shopNote').textContent=t('note_field');
    [3,4,5].forEach(n=>{
      const f=FIELD[n], has=n<=sizeMax, locked=f&&plv<f.need;
      let btn;
      if(size===n) btn=mkBtn(t('selected'),'eq',null,true);
      else if(has) btn=mkBtn(t('choose'),'eq',()=>{ if(setSize(n)) buildShop(); });
      else if(locked) btn=mkBtn(t('lock_lvl',f.need),'',null,true);
      else btn=mkBtn('🪙 '+fmt(f.price),'',()=>buyField(n),coins<f.price);
      list.appendChild(mkRow(emSw(n+'×'+n),t('fld_n',n),has?t('bought'):locked?t('need_pl',f.need):t('price_n',fmt(f.price)),btn));
    });
  } else {
    $('shopNote').textContent=t('note_boost');
    BOOSTS.forEach(bo=>{
      list.appendChild(mkRow(emSw(bo.e),t('bst_'+bo.id),t('bst_'+bo.id+'_d'),
        mkBtn('🪙 '+fmt(bo.price),'',()=>useBoost(bo.id),coins<bo.price||over)));
    });
  }
}
function buy(k){
  if(over) return;
  const p=price(k);
  if(k>maxEver+2){ toast(t('closed_mei')); return; }
  if(coins<p){ toast(t('no_coins')); return; }
  if(!emptyCells().length){ toast(t('no_room')); return; }
  coins-=p; popIdx=-1; floatQ=null; place(k);
  if(k>maxLv)maxLv=k; save(); coinSound(); setTimeout(()=>meow(k),120);
  render(); buildEvo(); buildShop(); checkOver();
}
function buyBg(id){
  const bg=BGS.find(z=>z.id===id);
  if(plv<bg.need){ toast(t('need_pl',bg.need)); return; }
  if(coins<bg.price){ toast(t('no_coins')); return; }
  coins-=bg.price; owned.push(id); bgId=id; save(); coinSound(); applyBg(); buildShop(); updateLobby(); if(board&&cur==='game')render();
}
function equipBg(id){ bgId=id; save(); applyBg(); buildShop(); }
function buyField(n){
  const f=FIELD[n];
  if(plv<f.need){ toast(t('need_pl',f.need)); return; }
  if(coins<f.price){ toast(t('no_coins')); return; }
  coins-=f.price; sizeMax=Math.max(sizeMax,n); save(); coinSound(); setSize(n); buildShop(); if(board&&cur==='game')render();
}
function useBoost(id){
  if(cur!=='game'){ toast(t('bst_need_game')); return; }
  if(over) return;
  const bo=BOOSTS.find(z=>z.id===id);
  if(coins<bo.price){ toast(t('no_coins')); return; }
  if(id==='sweep'){
    if(!board.some(v=>v===1)){ toast(t('bst_none')); return; }
    board=board.map(v=>v===1?0:v);
  } else if(id==='up'){
    const idx=[]; board.forEach((v,i)=>{ if(v&&v<MAX) idx.push(i); });
    if(!idx.length){ toast(t('bst_empty')); return; }
    const i=idx[Math.random()*idx.length|0]; board[i]++; popIdx=i; if(board[i]>maxLv)maxLv=board[i]; meow(board[i]);
  } else if(id==='x2'){ boost+=20;
  } else if(id==='hammer'){
    if(!board.some(v=>v)){ toast(t('bst_empty')); return; }
    mode='hammer'; closeSheets();
  } else if(id==='magic'){ magic=true; closeSheets();
  } else if(id==='shuffle'){
    if(board.filter(v=>v).length<2){ toast(t('bst_empty')); return; }
    for(let i=board.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; const tmp=board[i]; board[i]=board[j]; board[j]=tmp; }
  } else if(id==='box'){
    if(!emptyCells().length){ toast(t('no_room')); return; }
    const lo=Math.max(2,maxEver-4), hi=Math.min(MAX,maxEver+1), lv=lo+Math.floor(Math.random()*(hi-lo+1));
    place(lv); if(lv>maxLv)maxLv=lv; meow(lv);
  }
  coins-=bo.price; sel=null; qAdd('boost',1); save(); coinSound(); updateTag(); render(); buildShop(); checkOver();
}

// ------------------------------ батл пасс ------------------------------
function openPass(){ buildPass(); openSheet('pass'); }
function buildPass(){
  const tr=bpTier();
  $('pTier').textContent=t('bp_tier',tr,TIERS);
  $('pPts').textContent=t('bp_pts',bpPts);
  if(tr>=TIERS){ $('pFill').style.width='100%'; $('pNext').textContent=t('bp_max'); }
  else{
    const lo=tr?tierCum(tr):0, hi=tierCum(tr+1);
    $('pFill').style.width=((bpPts-lo)/(hi-lo)*100)+'%';
    $('pNext').textContent=t('bp_next',hi-bpPts);
  }
  const pb=$('pBuy');
  if(bpGold){ pb.textContent=t('bp_on'); pb.disabled=true; }
  else{ pb.textContent=t('bp_buy',fmt(PASS_PRICE)); pb.disabled=coins<PASS_PRICE; }
  const list=$('pList'); list.innerHTML='';
  for(let i=1;i<=TIERS;i++){
    const row=document.createElement('div'); row.className='prow'+(i===tr+1?' cur':'');
    const n=document.createElement('div'); n.className='tn'; n.textContent=i; row.appendChild(n);
    ['free','prem'].forEach(track=>{
      const r=passRew(i,track), done=(track==='free'?bpFree:bpPrem).indexOf(i)>=0;
      const reached=i<=tr, allowed=track==='free'||bpGold;
      const b=document.createElement('button'); b.textContent=rewLabel(r)+(allowed?'':' 🔒');
      if(done){ b.className='dn'; b.textContent=rewLabel(r)+' ✔'; b.disabled=true; }
      else if(reached&&allowed){ b.className='cl'+(track==='prem'?' g':''); b.onclick=()=>claim(i,track); }
      else { b.onclick=()=>toast(!reached?t('bp_noreach'):t('bp_need_prem')); }
      row.appendChild(b);
    });
    list.appendChild(row);
  }
  updateLobby();
}
function claim(i,track){
  const arr=track==='free'?bpFree:bpPrem;
  if(i>bpTier()||arr.indexOf(i)>=0||(track==='prem'&&!bpGold)) return;
  const r=passRew(i,track); arr.push(i);
  if(r.k==='coins') coins+=r.v;
  else if(r.k==='gift') gifts.push(r.v);
  else if(owned.indexOf(r.v)<0) owned.push(r.v);
  save(); coinSound(); toast(t('bp_got',rewLabel(r))); buildPass(); if(board&&cur==='game') render();
}
$('pBuy').onclick=()=>{
  if(bpGold) return;
  if(coins<PASS_PRICE){ toast(t('no_coins')); return; }
  coins-=PASS_PRICE; bpGold=true; save(); coinSound(); buildPass(); if(board&&cur==='game') render();
};

let panelType='daily', spinning=false, wheelRot=0;
function openPanel(type){ panelType=type; buildPanel(); openSheet('panel'); }
function drawWheel(c){
  const x=c.getContext('2d'), s=c.width, r=s/2-4, a=Math.PI*2/WHEEL.length;
  x.clearRect(0,0,s,s);
  WHEEL.forEach((p,i)=>{
    x.beginPath(); x.moveTo(s/2,s/2); x.arc(s/2,s/2,r,-Math.PI/2+i*a-a/2,-Math.PI/2+i*a+a/2); x.closePath();
    x.fillStyle=p.c; x.fill(); x.strokeStyle='#fff'; x.lineWidth=3; x.stroke();
    x.save(); x.translate(s/2,s/2); x.rotate(i*a); x.fillStyle='#222'; x.font='bold '+(s/13)+'px system-ui,sans-serif';
    x.textAlign='center'; x.fillText(wheelLabel(p),0,-r*0.68); x.restore();
  });
  x.beginPath(); x.arc(s/2,s/2,s/16,0,Math.PI*2); x.fillStyle='#fff'; x.fill();
}
function buildPanel(){
  const list=$('panelList'); list.innerHTML='';
  const titles={daily:'🎁 '+t('daily'),quests:'📋 '+t('quests'),ach:'🏆 '+t('ach'),coll:'📖 '+t('coll'),wheel:'🎡 '+t('wheel')};
  $('panelTitle').textContent=titles[panelType];
  if(panelType==='daily'){
    $('panelNote').textContent=t('d_note');
    const info=dailyInfo();
    for(let d=1;d<=7;d++){
      const r=dailyRew(d), done=d<=(info.claimed?info.day:info.day-1), isToday=!info.claimed&&d===info.day;
      let btn;
      if(done) btn=mkBtn('✔','ok',null,true);
      else if(isToday) btn=mkBtn(t('claim'),'',claimDaily);
      else btn=mkBtn('🔒','',null,true);
      const row=mkRow(emSw(d),t('d_day',d)+(isToday?' · '+t('d_today'):''),dailyLabel(r),btn);
      if(isToday) row.classList.add('hl');
      list.appendChild(row);
    }
    if(info.claimed){ const p=document.createElement('div'); p.className='note'; p.textContent=t('d_done'); list.appendChild(p); }
  } else if(panelType==='quests'){
    $('panelNote').textContent=t('q_note');
    ensureQuests();
    quest.list.forEach((q,i)=>{
      const ready=q.prog>=q.need&&!q.done;
      const btn=q.done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim')+' 🪙'+fmt(q.rw):'🪙 '+fmt(q.rw),'',()=>claimQuest(i),!ready);
      list.appendChild(mkRow(emSw('📋'),t('q_'+q.t,fmt(q.need)),(q.t==='reach'?Math.min(q.prog,q.need)>=q.need?'✔':nm(Math.min(MAX,q.need))+' → ':'')+(q.t==='reach'?'':fmt(Math.min(q.prog,q.need))+' / '+fmt(q.need)),btn));
    });
  } else if(panelType==='ach'){
    $('panelNote').textContent=t('a_note');
    ACH.forEach((a,i)=>{
      const v=achVal(a.k), done=achClaimed.indexOf(i)>=0, ready=v>=a.n&&!done;
      const btn=done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim')+' 🪙'+fmt(a.r):'🪙 '+fmt(a.r),'',()=>claimAch(i),!ready);
      const row=mkRow(emSw('🏆'),t('a_'+a.k,fmt(a.n)),fmt(Math.min(v,a.n))+' / '+fmt(a.n),btn);
      if(ready) row.classList.add('hl');
      list.appendChild(row);
    });
  } else if(panelType==='coll'){
    $('panelNote').textContent=t('c_note');
    const head=document.createElement('div'); head.className='note'; head.style.padding='0 0 6px'; head.textContent=t('c_count',maxEver,MAX); list.appendChild(head);
    COLL.forEach(c=>{
      const done=collClaimed.indexOf(c.n)>=0, ready=maxEver>=c.n&&!done;
      const btn=done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim')+' 🪙'+fmt(c.r):'🪙 '+fmt(c.r),'',()=>claimColl(c.n),!ready);
      const row=mkRow(emSw('📖'),t('c_ms',c.n),Math.min(maxEver,c.n)+' / '+c.n,btn);
      if(ready) row.classList.add('hl');
      list.appendChild(row);
    });
    const g=document.createElement('div'); g.className='cgrid';
    for(let lv=1;lv<=MAX;lv++){
      const d=document.createElement('div'); d.className='cc'+(lv>maxEver?' lock':'');
      const c=document.createElement('canvas'); c.width=c.height=96; draw(c,lv); d.appendChild(c);
      const s=document.createElement('span'); s.textContent=lv; d.appendChild(s);
      d.onclick=()=>{ if(lv<=maxEver){ meow(lv); toast(nm(lv)+' · '+t('lvl_n',lv)); } else toast('???'); };
      g.appendChild(d);
    }
    list.appendChild(g);
  } else {
    $('panelNote').textContent=t('w_note',WHEEL_COST);
    const wrap=document.createElement('div'); wrap.className='wheelwrap'; wrap.innerHTML='<div class="ptr">▼</div>';
    const c=document.createElement('canvas'); c.width=c.height=320; c.id='wheelCv'; drawWheel(c);
    c.style.transform='rotate('+wheelRot+'deg)'; wrap.appendChild(c); list.appendChild(wrap);
    const free=wheelDate!==today();
    const b=document.createElement('button'); b.className='spinbtn'; b.textContent=free?t('w_free'):t('w_paid',WHEEL_COST);
    b.disabled=spinning||(!free&&coins<WHEEL_COST); b.onclick=spin; list.appendChild(b);
  }
  updateBadges();
}
function claimDaily(){
  const info=dailyInfo(); if(info.claimed) return;
  const r=dailyRew(info.day);
  if(r.k==='coins') coins+=r.v; else { coins+=r.coins; gifts.push(r.gift); }
  dailyLast=today(); dailyStreak=info.day; save(); coinSound(); toast(t('bp_got',dailyLabel(r))); buildPanel(); updateLobby();
}
function claimQuest(i){
  const q=quest.list[i]; if(!q||q.done||q.prog<q.need) return;
  q.done=true; coins+=q.rw; addXp(20); save(); coinSound(); toast(t('bp_got','🪙 '+fmt(q.rw))); buildPanel(); updateLobby();
}
function claimAch(i){
  const a=ACH[i]; if(achClaimed.indexOf(i)>=0||achVal(a.k)<a.n) return;
  achClaimed.push(i); coins+=a.r; save(); coinSound(); toast(t('bp_got','🪙 '+fmt(a.r))); buildPanel(); updateLobby();
}
function claimColl(n){
  const c=COLL.find(z=>z.n===n); if(collClaimed.indexOf(n)>=0||maxEver<n) return;
  collClaimed.push(n); coins+=c.r; save(); coinSound(); toast(t('bp_got','🪙 '+fmt(c.r))); buildPanel(); updateLobby();
}
function spin(){
  if(spinning) return;
  const free=wheelDate!==today();
  if(!free && coins<WHEEL_COST){ toast(t('no_coins')); return; }
  if(free) wheelDate=today(); else coins-=WHEEL_COST;
  spinning=true; save();
  const tw=WHEEL.reduce((s,p)=>s+p.w,0); let r=Math.random()*tw, idx=0;
  for(;idx<WHEEL.length;idx++){ r-=WHEEL[idx].w; if(r<=0) break; } if(idx>=WHEEL.length) idx=WHEEL.length-1;
  const el=$('wheelCv'), base=Math.floor(wheelRot/360)*360;
  wheelRot=base+360*5+((360-idx*45)%360)+(Math.random()*20-10);
  el.style.transition='transform 3.2s cubic-bezier(.17,.67,.2,1)'; el.style.transform='rotate('+wheelRot+'deg)';
  const btn=document.querySelector('.spinbtn'); if(btn) btn.disabled=true;
  setTimeout(()=>{
    const p=WHEEL[idx]; let lab;
    if(p.k==='coins'){ coins+=p.v; lab='🪙 '+p.v; }
    else if(p.k==='xp'){ addXp(p.v); lab=t('w_xp',p.v); }
    else if(p.k==='x2'){ boost+=p.v; lab=t('w_x2'); updateTag(); }
    else { const lv=2+Math.floor(Math.random()*Math.max(1,Math.min(MAX,maxEver)-1)); gifts.push(lv); lab=t('bp_gift',lv); }
    spinning=false; save(); coinSound(); meow(3); toast(t('w_prize',lab));
    if($('panel').classList.contains('open')&&panelType==='wheel') buildPanel(); updateLobby();
  },3300);
}

// ------------------------------ экраны и кнопки ------------------------------
function show(name){
  cur=name;
  $('lobby').style.display = name==='lobby' ? 'flex' : 'none';
  $('game').style.display  = name==='game'  ? 'flex' : 'none';
  closeSheets(); $('over').style.display='none';
  window.scrollTo(0,0);
  if(name==='lobby') updateLobby();
}
$('play').onclick=()=>{ show('game'); newGame(); };
$('menu').onclick=()=>show('lobby');
$('toLobby').onclick=()=>show('lobby');
$('again').onclick=newGame;
$('restart').onclick=newGame;
$('lShop').onclick=openShop; $('shopBtn').onclick=openShop;
$('lPass').onclick=openPass; $('passBtn').onclick=openPass;
document.querySelectorAll('.ib').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
document.querySelectorAll('.closeBtn').forEach(b=>b.onclick=closeSheets);
$('tabMei').onclick=()=>{ shopTab='mei'; buildShop(); };
$('tabBg').onclick=()=>{ shopTab='bg'; buildShop(); };
$('tabBoost').onclick=()=>{ shopTab='boost'; buildShop(); };
$('tabField').onclick=()=>{ shopTab='field'; buildShop(); };
$('lSet').onclick=()=>openSheet('settings');
$('add').onclick=()=>{ if(over)return; popIdx=-1; floatQ=null; if(place(spawnLvl())){render();checkOver();} else toast(t('full')); };
$('mascotWrap').onclick=()=>{
  meow(maxEver); const w=$('mascotWrap'); w.classList.remove('hop'); void w.offsetWidth; w.classList.add('hop');
  burst(w,['❤️','💖','✨'],8); setTimeout(()=>w.classList.remove('hop'),600);
};
const toggleSnd=()=>{ muted=!muted; save(); setSndUI(); if(!muted)meow(1); };
const toggleMus=()=>{ musicOn=!musicOn; save(); setSndUI(); if(musicOn) musicStart(); else musicStop(); };
$('snd').onclick=toggleSnd; $('setSnd').onclick=toggleSnd;
$('mus').onclick=toggleMus; $('setMus').onclick=toggleMus;
$('setVibe').onclick=()=>{ vibe=!vibe; save(); setSndUI(); buzz(); };
$('setHints').onclick=()=>{ hints=!hints; save(); setSndUI(); };
$('setVol').oninput=e=>{ vol=e.target.value/100; save(); };
$('setVol').onchange=()=>meow(1);
$('setMVol').oninput=e=>{ mvol=e.target.value/100; save(); if(mvol<=0) musicStop(); else if(musicOn&&!mTimer) musicStart(); else musicVol(); };
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; save(); applyLang(); });
$('setReset').onclick=()=>{
  if(!confirm(t('confirm_reset'))) return;
  coins=0;best=0;maxEver=1;xp=0;plv=1;owned=[1];bgId=1;bpPts=0;bpFree=[];bpPrem=[];bpGold=false;gifts=[];boost=0;
  size=3;sizeMax=3;stats={merges:0,earned:0,games:0};dailyLast='';dailyStreak=0;quest={date:'',list:[]};achClaimed=[];collClaimed=[];wheelDate='';
  save(); applyBg(); applySize(); applyLang(); closeSheets(); toast(t('reset_done'));
};
document.addEventListener('pointerdown',()=>{ musicStart(); },{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) musicStop(); else if(musicOn) musicStart(); });

applyBg(); applySize(); applyLang(); show('lobby');
</script>
