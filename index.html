<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мей Мей Merge</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff3fa4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мей Мей">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{--fg:#222;--sub:#777;--box:#f0f0f4;--panel:#f6f6f9}
  body.dark{--fg:#fff;--sub:#b8bce0;--box:rgba(255,255,255,.14);--panel:rgba(255,255,255,.1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;min-height:100vh;background:#fff;color:var(--fg);
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .screen{display:flex;flex-direction:column;align-items:center;width:100%}
  h1{font-size:22px;margin:14px 0 4px}
  .hud{display:flex;gap:8px;margin:6px 0 6px}
  .box{background:var(--box);border-radius:12px;padding:6px 12px;text-align:center;min-width:80px}
  .box b{display:block;font-size:19px}
  .box span{font-size:10px;color:var(--sub);text-transform:uppercase}
  .box.coin b{color:#e0a000}
  .xptxt{font-size:12px;color:var(--sub);margin:2px 0}
  .bar{width:min(70vw,260px);height:9px;background:var(--box);border-radius:6px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:#ff3fa4;width:0;transition:width .3s}
  #boostTag{font-size:12px;color:#e0a000;font-weight:700;min-height:16px;text-align:center}
  #board{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;width:min(92vw,420px);
         background:var(--panel);padding:8px;border-radius:18px}
  #board[style*="--n: 4"],#board[style*="--n:4"]{gap:6px}
  #board[style*="--n: 5"],#board[style*="--n:5"]{gap:4px}
  .cell{aspect-ratio:1;border:2px solid transparent;border-radius:14px;background:#fff;padding:0;
        display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
        box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .cell canvas{width:92%;height:92%}
  .gtop{display:flex;align-items:stretch;gap:8px;width:min(92vw,420px);margin-top:12px}
  .gstat{flex:1;background:var(--box);border-radius:14px;padding:6px 8px;text-align:center}
  .gstat b{display:block;font-size:19px}
  .gstat span{font-size:10px;color:var(--sub);text-transform:uppercase}
  .gstat.coin b{color:#e0a000}
  .icoBtn{border:0;border-radius:14px;width:48px;font-size:22px;background:var(--box);color:var(--fg);cursor:pointer;flex:none}
  .icoBtn.gold{background:#e0a000}
  .glv{width:min(92vw,420px);display:flex;flex-direction:column;align-items:center;margin:6px 0 0}
  .glv .bar{width:100%;margin:2px 0 4px}
  .gbar{display:flex;gap:10px;align-items:center;justify-content:center;width:min(92vw,420px);margin:8px 0 24px}
  .gbar .icoBtn{height:58px;width:58px}
  .gbar #add{flex:1;justify-content:center;padding:8px 16px;font-size:16px;border-radius:16px;height:58px}
  #board{box-shadow:0 4px 18px rgba(0,0,0,.08)}
  #tut{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:center;justify-content:center;padding:20px}
  #tut .card{background:#fff;color:#222;border-radius:22px;padding:22px 20px;max-width:360px;width:100%;text-align:center}
  #tut h2{margin:0 0 10px}
  #tut p{margin:8px 0;font-size:15px;text-align:left}
  #add{display:inline-flex;align-items:center;gap:6px;padding:6px 16px}
  #add canvas{width:40px;height:40px}
  #add .plus{font-size:26px;font-weight:800;line-height:1}
  #add small{font-size:11px;font-weight:700;opacity:.9}
  #inv .main{padding:8px 12px;font-size:15px}
  #board{touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .cell.tgt{border-color:#3fb950;background:#eaffef;transform:scale(1.06)}
  .cell.sel{border-color:#ff3fa4;background:#fff0f8;transform:scale(1.04)}
  .cell.pop canvas{animation:pop .35s ease-out}
  .cell.new canvas{animation:appear .3s ease-out}
  .float{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:800;font-size:16px;
         color:#d99200;pointer-events:none;animation:fl .9s ease-out forwards;text-shadow:0 1px 0 #fff;white-space:nowrap;z-index:3}
  .bp{position:absolute;left:50%;top:50%;font-size:18px;pointer-events:none;z-index:3;animation:burst .85s ease-out forwards}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}
  @keyframes fl{to{transform:translate(-50%,-44px);opacity:0}}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes appear{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes hop{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-34px) scale(1.12,.92)}60%{transform:translateY(0) scale(.92,1.1)}100%{transform:translateY(0) scale(1)}}
  .name{font-size:15px;margin:10px 0 2px;min-height:20px;font-weight:600}
  .hint{font-size:13px;color:var(--sub);margin:0 12px 8px;text-align:center}
  .btns{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap;justify-content:center}
  button.main{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;
              background:#222;color:#fff;cursor:pointer}
  body.dark button.main{background:rgba(255,255,255,.2)}
  button.alt,body.dark button.alt{background:#ff3fa4}
  button.gold,body.dark button.gold{background:#e0a000}
  button.purple,body.dark button.purple{background:#7a55e0}
  button:disabled{opacity:.4}
  .evo{display:flex;gap:3px;margin:10px 0 24px;flex-wrap:wrap;justify-content:center;width:min(92vw,420px)}
  .evo canvas{width:calc(100%/11 - 3px);aspect-ratio:1;background:#f6f6f9;border-radius:6px}
  .evo canvas.lock{filter:brightness(0);opacity:.15}

  #lobby{min-height:100vh;justify-content:center;gap:8px;padding:16px 20px 28px}
  #lobby h1{font-size:30px;margin:0}
  #mascotWrap{position:relative;width:160px;height:160px;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
  #mascotWrap.hop{animation:hop .55s ease-out}
  #mascot{width:100%;height:100%}
  #lobby{gap:10px}
  .ptop{display:flex;align-items:center;gap:14px;width:min(92vw,420px);background:var(--panel);border-radius:20px;padding:10px 14px;cursor:pointer;box-sizing:border-box}
  #mascotWrap{flex:none;width:72px;height:72px;animation:none;border-radius:50%;background:#f0f0f4;overflow:hidden;box-sizing:border-box}
  .pinfo{flex:1;min-width:0;text-align:left}
  .pinfo .bar{width:100%;margin:4px 0 0}
  #mascotName{font-size:18px;font-weight:800;color:var(--fg)}
  #mascotTitle{font-size:12px;color:var(--sub)}
  #lobby .big.wide{width:min(92vw,420px)}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(92vw,420px)}
  .mgrid .big{width:100%;padding:14px 6px;font-size:15px}
  #lobby .iconrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,420px)}
  #lobby .iconrow .ib{width:auto}
  .cell.gold{background:linear-gradient(135deg,#fff3b0,#ffd23a)}
  .cell.gold::after{content:'✨×3';position:absolute;top:2px;right:4px;font-size:12px;font-weight:800;color:#8a5a00}
  .cell.ice canvas{opacity:.5;filter:saturate(.3)}
  .cell.ice{background:#dff3ff}
  .cell.ice::after{content:'❄️';position:absolute;top:2px;right:4px;font-size:18px}
  .big{width:min(80vw,300px);padding:14px;font-size:17px;border-radius:16px}
  .lstats{display:flex;gap:8px;margin-top:2px}
  .iconrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0}
  .ib{position:relative;width:54px;border:0;border-radius:14px;background:var(--box);color:var(--fg);padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .ib .em{font-size:24px;line-height:1}
  .ib small{font-size:10px;font-weight:600;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{display:none;position:absolute;top:-4px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;
       font-size:11px;font-style:normal;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
  .dot.on{display:block}

  #over{position:fixed;inset:0;background:rgba(255,255,255,.94);color:#222;display:none;z-index:30;
        flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  #over h2{margin:0;font-size:28px}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  #backdrop.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;background:#fff;color:#222;z-index:20;
        border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);
        transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;touch-action:pan-y}
  .sheet.open{transform:translateY(0)}
  .grab{width:42px;height:5px;border-radius:3px;background:#d8d8e0;margin:8px auto 0;flex:none}
  .sheet header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 12px;
        border-bottom:1px solid #eee;font-weight:700;font-size:17px;flex:none}
  .sheet header button{border:0;background:#f0f0f4;border-radius:10px;padding:8px 14px;font-size:15px;color:#222}
  .tabs{display:flex;gap:6px;padding:10px 14px 0;flex:none}
  .tab{flex:1;border:0;border-radius:10px;padding:9px 2px;background:#f0f0f4;font-weight:700;font-size:13px;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{background:#222;color:#fff}
  .note{font-size:12px;color:#888;padding:8px 16px 0;flex:none}
  .list{overflow-y:auto;padding:4px 14px 28px;overscroll-behavior:contain}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f4}
  .row canvas,.row .sw{width:54px;height:54px;background:#f6f6f9;border-radius:10px;flex:none;border:1px solid #e4e4ea}
  .row .sw.em{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .row canvas.lock{filter:brightness(0);opacity:.2}
  .row .info{flex:1;min-width:0}
  .row .info b{display:block;font-size:14px}
  .row .info small{color:#888;font-size:12px}
  .row.hl{background:#fff8e0}
  .row button{border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;
              background:#e0a000;color:#fff;white-space:nowrap}
  .row button.eq{background:#ff3fa4}
  .row button.ok{background:#e6f6e6;color:#3a8a3a}
  .row button:disabled{background:#ddd;color:#888}
  .row button.ok:disabled{background:#e6f6e6;color:#3a8a3a}
  .set{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #f0f0f4;font-size:16px;gap:10px}
  .set button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:#222;color:#fff;font-size:14px}
  .set button.red{background:#e5484d}
  .set input[type=range]{width:46%}
  .langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .langs button{background:#f0f0f4;color:#222;padding:8px 10px}
  .langs button.on{background:#ff3fa4;color:#fff}
  #setBody{overflow-y:auto;padding-bottom:20px;overscroll-behavior:contain}

  .pbox{padding:10px 16px 4px;flex:none}
  .pbar{height:12px;background:#f0f0f4;border-radius:7px;overflow:hidden;margin:6px 0}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#7a55e0,#ff3fa4);width:0}
  .prow{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0f4}
  .prow .tn{font-weight:800;color:#7a55e0;text-align:center}
  .prow.cur{background:#f7f2ff}
  .prow button{border:0;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;background:#f0f0f4;color:#888}
  .prow button.cl{background:#e0a000;color:#fff}
  .prow button.cl.g{background:#7a55e0}
  .prow button.dn{background:#e6f6e6;color:#3a8a3a}
  .phead{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;padding:4px 0;font-size:11px;font-weight:800;color:#888;text-align:center;text-transform:uppercase}

  .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0}
  .cc.sel{outline:3px solid #ff3fa4}
  .cc{background:#f6f6f9;border-radius:10px;text-align:center;font-size:11px;color:#888;padding:4px;cursor:pointer}
  .cc canvas{width:100%;aspect-ratio:1;display:block}
  .cc.lock canvas{filter:brightness(0);opacity:.2}
  .wheelwrap{position:relative;width:min(72vw,280px);margin:14px auto 8px}
  .wheelwrap canvas{width:100%;display:block;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;color:#e5484d;z-index:2;line-height:1}
  .spinbtn{display:block;margin:10px auto 4px;border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:700;background:#ff3fa4;color:#fff}
  .spinbtn:disabled{opacity:.5}
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);background:#222;color:#fff;
         padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;transition:transform .25s;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
  /* ===== v15 design polish ===== */
  body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.1px}
  h1{background:linear-gradient(90deg,#ff3fa4,#7a55e0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-weight:900;letter-spacing:-.5px}
  body.dark h1{background:linear-gradient(90deg,#ffd1ec,#d9ccff);-webkit-background-clip:text;background-clip:text}
  .ptop,.box,.gstat{box-shadow:0 2px 10px rgba(60,40,120,.08)}
  .ptop{border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,240,250,.7));border:1px solid rgba(255,255,255,.8)}
  body.dark .ptop{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15)}
  #mascotWrap{background:linear-gradient(135deg,#ffe3f3,#e6dcff);box-shadow:0 0 0 3px #fff,0 4px 12px rgba(122,85,224,.25)}
  .bar{height:8px}
  .bar i{background:linear-gradient(90deg,#ff3fa4,#ff9a5a)}
  .box,.gstat{border-radius:16px;background:rgba(255,255,255,.75)}
  body.dark .box,body.dark .gstat{background:rgba(255,255,255,.14)}
  .box b,.gstat b{font-weight:900}
  button.main{box-shadow:0 4px 0 rgba(0,0,0,.18),0 8px 16px rgba(0,0,0,.08);transition:transform .1s,box-shadow .1s;font-weight:700}
  button.main:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  button.alt,body.dark button.alt{background:linear-gradient(135deg,#ff5fb5,#ff3fa4 60%,#ff6b8a)}
  button.purple,body.dark button.purple{background:linear-gradient(135deg,#8c68f0,#7a55e0)}
  button.gold,body.dark button.gold{background:linear-gradient(135deg,#f2b51a,#e0a000)}
  #play{font-size:22px;padding:18px;border-radius:20px;letter-spacing:.3px}
  #lSet{background:linear-gradient(135deg,#4a4a5e,#2c2c3a)}
  .mgrid .big{border-radius:18px;padding:15px 6px;font-size:15px}
  .ib{background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(60,40,120,.08);border-radius:18px;padding:10px 2px 8px;transition:transform .1s}
  body.dark .ib{background:rgba(255,255,255,.14)}
  .ib:active{transform:scale(.94)}
  .dot{box-shadow:0 0 0 2px #fff}
  #board{border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.65),rgba(238,230,255,.65));box-shadow:0 8px 28px rgba(80,50,160,.14);border:1px solid rgba(255,255,255,.7)}
  body.dark #board{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}
  .cell{border-radius:16px;background:linear-gradient(180deg,#fff,#f4f0fb);box-shadow:0 2px 6px rgba(80,50,160,.12),inset 0 -2px 0 rgba(80,50,160,.06);transition:transform .12s,background .12s}
  .cell.tgt{background:linear-gradient(180deg,#f0fff3,#d8f8e0)}
  .cell.sel{background:linear-gradient(180deg,#fff5fb,#ffe0f1);box-shadow:0 0 0 3px rgba(255,63,164,.25),0 4px 12px rgba(255,63,164,.25)}
  .gbar #add{background:linear-gradient(135deg,#ff5fb5,#ff3fa4);box-shadow:0 5px 0 #c92a80,0 10px 18px rgba(255,63,164,.25)}
  .gbar #add:active{transform:translateY(4px);box-shadow:0 1px 0 #c92a80}
  .icoBtn{border-radius:18px;background:rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(60,40,120,.1)}
  body.dark .icoBtn{background:rgba(255,255,255,.16)}
  .icoBtn.gold{background:linear-gradient(135deg,#f2b51a,#e0a000);box-shadow:0 4px 0 #b07f00}
  .glv .bar{height:10px}
  .sheet{border-radius:26px 26px 0 0;box-shadow:0 -8px 32px rgba(40,20,90,.28)}
  .sheet header{font-size:18px;font-weight:800}
  .tab.on{background:linear-gradient(135deg,#8c68f0,#7a55e0)}
  .row{padding:10px 0}
  .row canvas,.row .sw{border-radius:14px;background:linear-gradient(180deg,#fff,#f4f0fb)}
  .row button{border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  #tut .card{border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  #toast{border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

  /* merge effects */
  .ring{position:absolute;inset:6%;border-radius:50%;border:4px solid var(--rc,#ff3fa4);pointer-events:none;z-index:2;animation:ringx .6s ease-out forwards}
  .ring.r2{animation-delay:.12s;opacity:0}
  @keyframes ringx{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.9);opacity:0;border-width:1px}}
  .cell.glow{animation:glowx .7s ease-out}
  @keyframes glowx{0%{box-shadow:0 0 0 0 var(--rc,#ff3fa4)}40%{box-shadow:0 0 28px 6px var(--rc,#ff3fa4)}100%{box-shadow:0 2px 6px rgba(80,50,160,.12)}}
  #board.shake{animation:shk .4s ease-out}
  @keyframes shk{0%,100%{transform:translate(0)}15%{transform:translate(-5px,2px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(3px,3px)}80%{transform:translate(-2px,1px)}}
  .bp.big{font-size:24px}
  .set small.sub{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
  .set .pair{display:flex;gap:6px}
</style>
</head>
<body>

<!-- ============ ЛОББИ ============ -->
<div id="lobby" class="screen">
  <h1>Мей Мей Merge</h1>
  <div class="ptop" id="ptop">
    <div id="mascotWrap"><canvas id="mascot" width="160" height="160"></canvas></div>
    <div class="pinfo">
      <div id="mascotName"></div>
      <div id="mascotTitle"></div>
      <div class="xptxt xpl"></div>
      <div class="bar"><i class="xpfill"></i></div>
    </div>
  </div>
  <div class="lstats">
    <div class="box coin"><span data-i="coins"></span><b id="lCoins">0</b></div>
    <div class="box"><span data-i="best"></span><b id="lBest">0</b></div>
  </div>
  <button class="main alt big wide" id="play" data-i="play"></button>
  <div class="mgrid">
    <button class="main purple big" id="lTimed" data-i="timed_btn"></button>
    <button class="main purple big" id="lPass"></button>
    <button class="main gold big" id="lShop" data-i="shop"></button>
    <button class="main big" id="lSet" data-i="settings"></button>
  </div>
  <div class="iconrow">
    <button class="ib" data-panel="daily"><span class="em">🎁</span><small data-i="daily"></small><i class="dot"></i></button>
    <button class="ib" data-panel="quests"><span class="em">📋</span><small data-i="quests"></small><i class="dot"></i></button>
    <button class="ib" data-panel="chal"><span class="em">🎯</span><small data-i="chal"></small><i class="dot"></i></button>

function meow(lv, sad){

    const V=VOICES.find(z=>z.id===voiceId)||VOICES[0]; const a=ac(), tm=a.currentTime, dur=((sad?0.9:0.42)+Math.random()*0.12)*V.d;
    const base=((sad?330:560)-Math.min(lv,40)*5+Math.random()*70)*V.p;
    const o=a.createOscillator(); o.type=V.w;
    o.frequency.setValueAtTime(base*0.8,tm);
    o.frequency.linearRampToValueAtTime(base*(sad?1.1:1.55),tm+dur*0.35);
    o.frequency.linearRampToValueAtTime(base*(sad?0.6:0.9),tm+dur);
    const vib=a.createOscillator(), vg=a.createGain(); vib.frequency.value=V.v; vg.gain.value=base*0.025;
    vib.connect(vg); vg.connect(o.frequency);
    const f=a.createBiquadFilter(); f.type='bandpass'; f.Q.value=4.5;
    f.frequency.setValueAtTime(700*V.f,tm); f.frequency.linearRampToValueAtTime(1900*V.f,tm+dur*0.4); f.frequency.linearRampToValueAtTime(850*V.f,tm+dur);
    const g=a.createGain(); g.gain.setValueAtTime(0.0001,tm);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,0.55*vol),tm+0.07); g.gain.exponentialRampToValueAtTime(0.0001,tm+dur);
    o.connect(f); f.connect(g); g.connect(a.destination);

  }catch(e){}
}

let mTimer=null, mNext=0, mStep=0, mMaster=null, mDelay=null, mLp=null;
function musicStart(){
  if(!musicOn||mvol<=0||mTimer) return;
  try{
    const a=ac();
    mMaster=a.createGain(); mMaster.gain.value=0; mMaster.connect(a.destination);
    mLp=a.createBiquadFilter(); mLp.type='lowpass'; mLp.frequency.value=TR().lp; mLp.connect(mMaster);
    mDelay=a.createDelay(1.5); mDelay.delayTime.value=TR().dly;

    mMaster.gain.setTargetAtTime(mvol*0.45,a.currentTime,0.8);
    mNext=a.currentTime+0.2; mStep=0;
    mTimer=setInterval(musicTick,600); musicTick();
  }catch(e){}
}
function musicTick(){
  try{ const a=ac(); while(mNext<a.currentTime+3){ const T=TR(); schedChord(a,mNext,T.chords[mStep%T.chords.length]); mNext+=T.len; mStep++; } }catch(e){}
}
function schedChord(a,t0,chord){
  const T=TR(), L=T.len, pg=T.pg;
  chord.forEach((m,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type=i===0?T.pad[0]:T.pad[1]; o.frequency.value=mf(m);
    o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime((i===0?0.16:0.07)*pg,t0+Math.min(1.8,L/3)); g.gain.linearRampToValueAtTime(0.0001,t0+L+0.4);
    o.connect(g); g.connect(mLp); const s2=a.createGain(); s2.gain.value=0.5; g.connect(s2); s2.connect(mDelay);
    o.start(t0); o.stop(t0+L+0.5);
  });
  const n=T.bells[0]+Math.floor(Math.random()*T.bells[1]);
  for(let k=0;k<n;k++){
    const tt=t0+0.5+k*(L-1)/n+Math.random()*0.3, m=T.pent[Math.floor(Math.random()*T.pent.length)];
    const o=a.createOscillator(), g=a.createGain(); o.type=T.bt; o.frequency.value=mf(m);
    g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(0.09,tt+0.03); g.gain.exponentialRampToValueAtTime(0.0001,tt+1.6);
    o.connect(g); g.connect(mLp); const s2=a.createGain(); s2.gain.value=0.7; g.connect(s2); s2.connect(mDelay);
    o.start(tt); o.stop(tt+1.7);
  }
}
function musicStop(){
  if(mTimer){ clearInterval(mTimer); mTimer=null; }
  if(mMaster){
    try{ const a=ac(); mMaster.gain.cancelScheduledValues(a.currentTime); mMaster.gain.setTargetAtTime(0,a.currentTime,0.15);
      const mm=mMaster; setTimeout(()=>{try{mm.disconnect();}catch(e){}},900); }catch(e){}

  }
}

  const a=board[from], b=board[to];
  if(!b){ board[to]=a; board[from]=0; newIdx=to; render(); return; }
  const same=a===b&&b<MAX;
  if(!same){ render(); return; }
  const sb=spawnLvl(), nl=Math.max(a,b)+1, norm=!special();
  board[to]=nl; board[from]=0; popIdx=to;
  const now=Date.now(); combo=(now-lastMergeT<3500)?combo+1:1; lastMergeT=now; if(combo>bestCombo) bestCombo=combo;
  const cm=1+0.25*Math.min(combo-1,8), pts=Math.round(nl*10*cm);
  let gain=0, goldHit=false;
  if(norm){
    let mm=1; if(to===golden){ mm*=3; goldHit=true; golden=-1; }
    gain=Math.max(1,Math.round(reward(nl)*cm*mm)); coins+=gain; stats.earned+=gain; qAdd('earn',gain);
  }
  score+=pts; stats.merges++;
  if(nl>maxLv)maxLv=nl; if(nl>stageLv)stageLv=nl; if(nl>maxEver)maxEver=nl; if(norm&&score>best)best=score;
  qAdd('merge',1); qMax('reach',nl); qMax('combo',combo);
  if(norm&&nl>=evtLv){ checkEvent(); evtProg=Math.min(evtNeed,evtProg+1); }
  floatQ=[to,(special()?'+'+pts:'+'+fmt(gain)+' 🪙')+(combo>1?' 🔥×'+combo:'')+(goldHit?' ✨×3':''),nl];
  meow(nl); buzz(); addXp(nl*2); if(norm) addBp(nl);
  if(timed) place(spawnLvl());
  else if(norm){
    if(frozen>=0){ frozenLeft--; if(frozenLeft<=0){ frozen=-1; setTimeout(()=>toast(t('ice_thaw')),600); } }
    if(golden>=0){ gMerges++; if(gMerges>8) golden=-1; }
    const mei=[]; board.forEach((v,i)=>{ if(v>0&&i!==frozen&&i!==golden) mei.push(i); });
    if(golden<0&&mei.length&&Math.random()<0.12){ golden=mei[Math.random()*mei.length|0]; gMerges=0; setTimeout(()=>toast(t('gold_new')),500); }
    else if(frozen<0&&golden!==to&&mei.length>2&&Math.random()<0.06){ const c=mei.filter(i=>i!==to&&i!==golden); if(c.length){ frozen=c[Math.random()*c.length|0]; frozenLeft=4; setTimeout(()=>toast(t('ice_new')),500); } }
    if(!board.some(v=>v<0) && emptyCells().length && Math.random()<0.04){ place(-1); setTimeout(()=>toast(t('box_new')),900); }
  }
  save(); updateTag(); updateAdd();
  if(spawnLvl()>sb) setTimeout(()=>toast(t('spawn_up')),1100);
  if(chal&&nl>=chalGoal){ render(); finishChal(true); return; }
  afterMove();
}

// ---- особые режимы ----
const special=()=>timed||chal;
function stashGame(){ if(!special()) stash=board?{board:board.slice(),score,over,maxLv,stageLv,size}:{none:true,size}; }
function resetBoardState(){ over=false; maxLv=1; stageLv=1; combo=0; mode=null; magic=false; sel=null; popIdx=-1; newIdx=-1; floatQ=null; score=0; golden=-1; frozen=-1; $('over').style.display='none'; }
function startTimed(){
  stashGame(); chal=false; timed=true; show('game');
  const n=N(); board=Array(n).fill(0); resetBoardState(); applySize();
  const cnt=Math.ceil(n*0.6); for(let k=0;k<cnt;k++) place(Math.random()<0.25?2:1);
  newIdx=-1; tEnd=Date.now()+60000; clearInterval(tTimer); tTimer=setInterval(timedTick,200);
  stats.games++; qAdd('play',1); save(); render(); updateTag(); updateAdd();
}
function timedTick(){ if(Date.now()>=tEnd) finishTimed(); else updateTag(); }
function finishTimed(){
  clearInterval(tTimer); tTimer=null; over=true; mode=null; sel=null;
  const rw=Math.round(score/8); coins+=rw; addXp(Math.round(score/20));
  if(score>bestTimed) bestTimed=score; qMax('timed',score); save(); meow(Math.max(3,stageLv));

  $('overScore').textContent=t('timed_over',score,rw,bestTimed);

function startChal(){
  stashGame(); timed=false; chal=true; clearInterval(tTimer); tTimer=null; show('game');
  const ci=chalInfo(); size=4; applySize(); board=Array(16).fill(0); resetBoardState();
  chalR=seedRand('chal'+today()); chalLeft=ci.spawns; chalGoal=ci.goal;
  const idx=[]; for(let k=0;k<16;k++) idx.push(k);
  for(let k=15;k>0;k--){ const j=Math.floor(chalR()*(k+1)); const tmp=idx[k]; idx[k]=idx[j]; idx[j]=tmp; }
  const lv=[1,1,1,2,2,3]; for(let k=0;k<ci.start;k++) board[idx[k]]=lv[Math.floor(chalR()*lv.length)];
  chalNext=chalR()<0.3?2:1; render(); updateTag(); updateAdd();
}
function chalSpawn(){
  if(over||chalLeft<1) return;
  if(place(chalNext)){ chalLeft--; chalNext=chalR()<0.3?2:1; render(); updateAdd(); updateTag(); checkOver(); } else toast(t('full'));
}
function finishChal(win){
  if(over) return; over=true; mode=null; sel=null; let txt;

    if(chalDone!==today()){
      chalStreak=(chalDone===yesterday())?chalStreak+1:1; chalDone=today();

  document.querySelector('#over h2').textContent=t(win?'chal_win':'chal_lose');
  $('overScore').textContent=txt; $('over').style.display='flex'; updateTag(); render(); updateBadges();
}
function leaveTimed(){
  clearInterval(tTimer); tTimer=null;
  if(!timed&&!chal) return;
  timed=false; chal=false; combo=0; mode=null; magic=false; sel=null; golden=-1; frozen=-1;

    size=stash.size; applySize();

let panelType='daily', spinning=false, wheelRot=0;

function drawWheel(c){
  const x=c.getContext('2d'), s=c.width, r=s/2-4, a=Math.PI*2/WHEEL.length;
  x.clearRect(0,0,s,s);
  WHEEL.forEach((p,i)=>{
    x.beginPath(); x.moveTo(s/2,s/2); x.arc(s/2,s/2,r,-Math.PI/2+i*a-a/2,-Math.PI/2+i*a+a/2); x.closePath();
    x.fillStyle=p.c; x.fill(); x.strokeStyle='#fff'; x.lineWidth=3; x.stroke();
    x.save(); x.translate(s/2,s/2); x.rotate(i*a); x.fillStyle='#222'; x.font='bold '+(s/13)+'px system-ui,sans-serif';
    x.textAlign='center'; x.fillText(wheelLabel(p),0,-r*0.68); x.restore();
  });
  x.beginPath(); x.arc(s/2,s/2,s/16,0,Math.PI*2); x.fillStyle='#fff'; x.fill();
}

          const c=document.createElement('canvas'); c.width=c.height=108; draw(c,p.lv); const a=petAmount(p);
          const row=mkRow(c,nm(p.lv),t('pet_rate',fmt(petRate(p.lv)))+' · '+t('pet_have',fmt(a)),mkBtn(t('pet_collect'),'',()=>petCollect(i),a<1));
          row.appendChild(mkBtn(t('pet_change'),'eq',()=>{ petPick=i; buildPanel(); })); list.appendChild(row);
        } else list.appendChild(mkRow(emSw('🏡'),t('pet_empty'),'',mkBtn(t('pet_pick'),'',()=>{ petPick=i; buildPanel(); })));
      }
      if(petSlots<PET_COSTS.length){
        const cost=PET_COSTS[petSlots];
        list.appendChild(mkRow(emSw('➕'),t('pet_buy'),t('price_n',fmt(cost)),mkBtn('🪙 '+fmt(cost),'',()=>{ if(coins<cost){ toast(t('no_coins')); return; } coins-=cost; pets.push(null); petSlots++; save(); coinSound(); buildPanel(); updateLobby(); },coins<cost)));
      }
    }
  } else if(panelType==='chal'){
    const ci=chalInfo(), done=chalDone===today();
    $('panelNote').textContent=t('chal_note',nm(ci.goal),ci.spawns);
    list.appendChild(mkRow(emSw('🎯'),t('chal_goal',nm(ci.goal)),done?t('chal_done'):t('chal_streak',chalStreakNow()),mkBtn('▶','',()=>{ closeSheets(); startChal(); })));
    if(!done) list.appendChild(mkRow(emSw('🔥'),t('chal_streak',chalStreakNow()),'🪙 '+fmt(150+plv*20+Math.min(7,chalStreakNow()+1)*20),null));
  } else if(panelType==='event'){
    checkEvent();
    $('panelNote').textContent=t('evt_note',evtNeed,nm(evtLv),weekDaysLeft());
    const c=document.createElement('canvas'); c.width=c.height=108; draw(c,evtLv);
    list.appendChild(mkRow(c,nm(evtLv),Math.min(evtProg,evtNeed)+' / '+evtNeed,null));
    evtMs().forEach((n,i)=>{
      const r=evtReward(i), done=evtClaimed.indexOf(i)>=0, ready=evtProg>=n&&!done;
      const lab='🪙 '+fmt(r.coins);
      const btn=done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim'):lab,'',()=>evtClaim(i),!ready);
      const row=mkRow(emSw(i+1),t('evt_m',n),Math.min(evtProg,n)+' / '+n+' · '+lab,btn); if(ready) row.classList.add('hl'); list.appendChild(row);
    });
  } else if(panelType==='profile'){
    $('panelNote').textContent='';
    const top=document.createElement('div'); top.style.cssText='display:flex;align-items:center;gap:14px;padding:6px 4px 12px';
    const c=document.createElement('canvas'); c.width=c.height=120; c.style.cssText='width:84px;height:84px;background:#f0f0f4;border-radius:50%;box-sizing:border-box'; applyFrame(c,frameId); draw(c,avatarLv()); top.appendChild(c);
    const info=document.createElement('div'); info.style.flex='1';
    const nmEl=document.createElement('b'); nmEl.style.fontSize='20px'; nmEl.textContent=nick||t('nick'); info.appendChild(nmEl);
    const sub=document.createElement('div'); sub.className='xptxt'; sub.textContent=titleName(titleId)+' · '+t('pf_level')+' '+plv; info.appendChild(sub);
    top.appendChild(info);
    top.appendChild(mkBtn('✏️','',()=>{ const v=prompt(t('nick_prompt'),nick); if(v!==null){ nick=v.trim().slice(0,16); save(); buildPanel(); updateLobby(); } }));
    list.appendChild(top);
    const st=[['🏅',t('pf_best'),fmt(best)],['⏱',t('pf_timed'),fmt(bestTimed)],['🔗',t('pf_merges'),fmt(stats.merges)],['🪙',t('pf_earned'),fmt(stats.earned)],
      ['🎮',t('pf_games'),fmt(stats.games)],['📖',t('pf_coll'),seen.length+' / '+MAX],['🎟',t('pf_tier'),Math.max(bpBest,bpTier())+' / '+TIERS],['🔥',t('pf_combo'),'×'+Math.max(1,bestCombo)]];
    st.forEach(r=>list.appendChild(mkRow(emSw(r[0]),r[1],r[2],null)));
    const h=document.createElement('div'); h.className='note'; h.style.fontWeight='700'; h.textContent=t('pf_avatar'); list.appendChild(h);
    list.appendChild(mkBtn(t('pf_auto'),avatar?'':'eq',()=>{ avatar=0; save(); buildPanel(); updateLobby(); }));
    const g=document.createElement('div'); g.className='cgrid';
    seen.slice().sort((a,b)=>a-b).forEach(lv=>{
      const d=document.createElement('div'); d.className='cc'+(avatar===lv?' sel':'');
      const cv=document.createElement('canvas'); cv.width=cv.height=96; draw(cv,lv); d.appendChild(cv);
      d.onclick=()=>{ avatar=lv; save(); meow(lv); buildPanel(); updateLobby(); }; g.appendChild(d);
    });
    list.appendChild(g);
    const hd=txt=>{ const d=document.createElement('div'); d.className='note'; d.style.fontWeight='700'; d.textContent=txt; list.appendChild(d); };
    hd(t('pf_title'));
    TITLES.forEach(ti=>{ const ok=ti.ok(), cu=titleId===ti.id;
      list.appendChild(mkRow(emSw('🏷'),L3(ti.n),L3(ti.d),cu?mkBtn(t('selected'),'eq',null,true):ok?mkBtn(t('choose'),'eq',()=>{ titleId=ti.id; save(); buildPanel(); updateLobby(); }):mkBtn('🔒','',null,true))); });
    hd(t('pf_frame'));
    FRAMES.forEach(fr=>{
      const own=fr.ok()||framesOwned.indexOf(fr.id)>=0, cu=frameId===fr.id; const sw=document.createElement('div'); sw.className='sw'; applyFrame(sw,fr.id);
      let btn;
      if(cu) btn=mkBtn(t('selected'),'eq',null,true);
      else if(own) btn=mkBtn(t('choose'),'eq',()=>{ frameId=fr.id; save(); buildPanel(); updateLobby(); });
      else if(fr.price) btn=mkBtn('🪙 '+fmt(fr.price),'',()=>{ if(coins<fr.price){ toast(t('no_coins')); return; } coins-=fr.price; framesOwned.push(fr.id); frameId=fr.id; save(); coinSound(); buildPanel(); updateLobby(); },coins<fr.price);
      else btn=mkBtn('🔒','',null,true);
      list.appendChild(mkRow(sw,L3(fr.n),own||!fr.price?L3(fr.d):t('price_n',fmt(fr.price)),btn));
    });
  } else if(panelType==='quests'){
    $('panelNote').textContent=t('q_note');
    ensureQuests();
    quest.list.forEach((q,i)=>{
      const ready=q.prog>=q.need&&!q.done;
      const btn=q.done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim')+' 🪙'+fmt(q.rw):'🪙 '+fmt(q.rw),'',()=>claimQuest(i),!ready);
      list.appendChild(mkRow(emSw('📋'),t('q_'+q.t,fmt(q.need)),(q.t==='reach'?Math.min(q.prog,q.need)>=q.need?'✔':nm(Math.min(MAX,q.need))+' → ':'')+(q.t==='reach'?'':fmt(Math.min(q.prog,q.need))+' / '+fmt(q.need)),btn));
    });
  } else if(panelType==='ach'){
    $('panelNote').textContent=t('a_note');
    ACH.forEach((a,i)=>{
      const v=achVal(a.k), done=achClaimed.indexOf(i)>=0, ready=v>=a.n&&!done;
      const btn=done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim')+' 🪙'+fmt(a.r):'🪙 '+fmt(a.r),'',()=>claimAch(i),!ready);
      const row=mkRow(emSw('🏆'),t('a_'+a.k,fmt(a.n)),fmt(Math.min(v,a.n))+' / '+fmt(a.n),btn);
      if(ready) row.classList.add('hl');
      list.appendChild(row);
    });
  } else if(panelType==='coll'){
    $('panelNote').textContent=t('c_note');
    const head=document.createElement('div'); head.className='note'; head.style.padding='0 0 6px'; head.textContent=t('c_count',seen.length,MAX); list.appendChild(head);
    COLL.forEach(c=>{
      const done=collClaimed.indexOf(c.n)>=0, ready=seen.length>=c.n&&!done;
      const btn=done?mkBtn('✔','ok',null,true):mkBtn(ready?t('claim')+' 🪙'+fmt(c.r):'🪙 '+fmt(c.r),'',()=>claimColl(c.n),!ready);
      const row=mkRow(emSw('📖'),t('c_ms',c.n),Math.min(seen.length,c.n)+' / '+c.n,btn);
      if(ready) row.classList.add('hl');
      list.appendChild(row);
    });
    const g=document.createElement('div'); g.className='cgrid';
    for(let lv=1;lv<=MAX;lv++){
      const d=document.createElement('div'); d.className='cc'+(seen.indexOf(lv)<0?' lock':'');
      const c=document.createElement('canvas'); c.width=c.height=96; draw(c,lv); d.appendChild(c);
      const s=document.createElement('span'); s.textContent=lv; d.appendChild(s);
      d.onclick=()=>{ if(seen.indexOf(lv)>=0){ meow(lv); toast(story(lv),3800); } else toast('???'); };
      g.appendChild(d);
    }
    list.appendChild(g);
  } else {
    $('panelNote').textContent=t('w_note',WHEEL_COST);
    const wrap=document.createElement('div'); wrap.className='wheelwrap'; wrap.innerHTML='<div class="ptr">▼</div>';
    const c=document.createElement('canvas'); c.width=c.height=320; c.id='wheelCv'; drawWheel(c);
    c.style.transform='rotate('+wheelRot+'deg)'; wrap.appendChild(c); list.appendChild(wrap);
    const free=wheelDate!==today();
    const b=document.createElement('button'); b.className='spinbtn'; b.textContent=free?t('w_free'):t('w_paid',WHEEL_COST);
    b.disabled=spinning||(!free&&coins<WHEEL_COST); b.onclick=spin; list.appendChild(b);
  }
  updateBadges();
}
function claimDaily(){
  const info=dailyInfo(); if(info.claimed) return;
  const r=dailyRew(info.day);
  if(r.k==='coins') coins+=r.v; else { coins+=r.coins; gifts.push(r.gift); }
  dailyLast=today(); dailyStreak=info.day; save(); coinSound(); toast(t('bp_got',dailyLabel(r))); buildPanel(); updateLobby();
}
function claimQuest(i){
  const q=quest.list[i]; if(!q||q.done||q.prog<q.need) return;
  q.done=true; coins+=q.rw; addXp(20); save(); coinSound(); toast(t('bp_got','🪙 '+fmt(q.rw))); buildPanel(); updateLobby();
}
function claimAch(i){
  const a=ACH[i]; if(achClaimed.indexOf(i)>=0||achVal(a.k)<a.n) return;
  achClaimed.push(i); coins+=a.r; save(); coinSound(); toast(t('bp_got','🪙 '+fmt(a.r))); buildPanel(); updateLobby();
}
function claimColl(n){
  const c=COLL.find(z=>z.n===n); if(collClaimed.indexOf(n)>=0||seen.length<n) return;
  collClaimed.push(n); coins+=c.r; save(); coinSound(); toast(t('bp_got','🪙 '+fmt(c.r))); buildPanel(); updateLobby();
}
function spin(){
  if(spinning) return;
  const free=wheelDate!==today();
  if(!free && coins<WHEEL_COST){ toast(t('no_coins')); return; }
  if(free) wheelDate=today(); else coins-=WHEEL_COST;
  spinning=true; save();
  const tw=WHEEL.reduce((s,p)=>s+p.w,0); let r=Math.random()*tw, idx=0;
  for(;idx<WHEEL.length;idx++){ r-=WHEEL[idx].w; if(r<=0) break; } if(idx>=WHEEL.length) idx=WHEEL.length-1;
  const el=$('wheelCv'), base=Math.floor(wheelRot/360)*360;
  wheelRot=base+360*5+((360-idx*45)%360)+(Math.random()*20-10);
  el.style.transition='transform 3.2s cubic-bezier(.17,.67,.2,1)'; el.style.transform='rotate('+wheelRot+'deg)';
  const btn=document.querySelector('.spinbtn'); if(btn) btn.disabled=true;
  setTimeout(()=>{
    const p=WHEEL[idx]; let lab;
    if(p.k==='coins'){ coins+=p.v; lab='🪙 '+p.v; }
    else if(p.k==='xp'){ addXp(p.v); lab=t('w_xp',p.v); }
    else { const lv=2+Math.floor(Math.random()*Math.max(1,Math.min(MAX,maxEver)-1)); gifts.push(lv); lab=t('bp_gift',lv); }
    spinning=false; save(); coinSound(); meow(3); toast(t('w_prize',lab));
    if($('panel').classList.contains('open')&&panelType==='wheel') buildPanel(); updateLobby();
  },3300);
}

function show(name){
  const was=cur;
  if(name==='lobby') leaveTimed();
  if(name==='lobby'&&was==='game'){ board=null; over=false; mode=null; magic=false; sel=null; save(); }
  cur=name;
  $('lobby').style.display = name==='lobby' ? 'flex' : 'none';
  $('game').style.display  = name==='game'  ? 'flex' : 'none';
  closeSheets(); $('over').style.display='none';
  window.scrollTo(0,0);
  if(name==='lobby'){ checkSeason(); updateLobby(); updatePlayBtn(); }
}

  size=3;sizeMax=3;stats={merges:0,earned:0,games:0};dailyLast='';dailyStreak=0;quest={date:'',list:[]};achClaimed=[];collClaimed=[];wheelDate='';

// ---- код сохранения ----
const SAVE_MAGIC='MEIMEI1:';
function makeCode(){ save(); const raw=localStorage.getItem('meimei-save5')||'{}'; return SAVE_MAGIC+btoa(unescape(encodeURIComponent(raw))); }
$('bkCopy').onclick=()=>{
  let code; try{ code=makeCode(); }catch(e){ toast(t('bk_bad')); return; }
  const fb=()=>{ try{ prompt(t('bk_manual'),code); }catch(e){} };
  try{ navigator.clipboard.writeText(code).then(()=>toast(t('bk_copied'),3200),fb); }catch(e){ fb(); }
};
$('bkPaste').onclick=()=>{
  let c; try{ c=prompt(t('bk_prompt'),''); }catch(e){ return; }
  if(!c) return; c=c.trim();
  try{
    if(c.indexOf(SAVE_MAGIC)!==0) throw 0;
    const raw=decodeURIComponent(escape(atob(c.slice(SAVE_MAGIC.length))));
    const d=JSON.parse(raw); if(!d||typeof d!=='object'||d.coins===undefined) throw 0;
    localStorage.setItem('meimei-save5',raw); toast(t('bk_ok')); setTimeout(()=>location.reload(),700);
  }catch(e){ toast(t('bk_bad')); }
};
document.addEventListener('pointerdown',()=>{ musicStart(); },{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) musicStop(); else if(musicOn) musicStart(); });

setInterval(()=>{ if(cur==='game'&&!document.hidden) updateTag(); },500);
applyBg(); applySize(); applyLang(); show('lobby');
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ window.addEventListener('load',()=>{ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }); }
